<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>链上浏览器 · Sepolia</title>
<script src="networks.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0f14; color: #d6e2ee;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, "Courier New", "PingFang SC", "Microsoft YaHei", monospace;
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  header { margin-bottom: 22px; }
  h1 { font-size: 26px; letter-spacing: 1px; color: #7dd3fc; }
  h1 .dim { color: #475569; font-weight: 400; }
  .netline { margin-top: 6px; font-size: 12px; color: #64748b; }
  .netline .ok { color: #34d399; }
  .netline .bad { color: #f87171; }
  .query { display: flex; gap: 10px; margin: 18px 0 14px; flex-wrap: wrap; }
  .query input {
    flex: 1; min-width: 220px; background: #111827; border: 1px solid #1f2937; color: #e2e8f0;
    padding: 10px 14px; font: inherit; font-size: 13px; outline: none;
  }
  .query input:focus { border-color: #38bdf8; }
  .query select {
    flex: none; max-width: 215px; background: #111827; border: 1px solid #1f2937; color: #e2e8f0;
    padding: 10px 10px; font: inherit; font-size: 13px; outline: none; cursor: pointer;
  }
  .query select:focus { border-color: #38bdf8; }
  .query select option, .query select optgroup { background: #111827; color: #e2e8f0; }
  .query button, .btn {
    background: transparent; color: #7dd3fc; border: 1px solid #1e3a5f; padding: 10px 20px;
    font: inherit; font-size: 13px; font-weight: 400; cursor: pointer; white-space: nowrap;
    text-decoration: none; display: inline-block;
  }
  .query button:hover, .btn:hover { background: #0c1a2b; border-color: #38bdf8; color: #a5e8ff; }
  .btn.ghost { background: transparent; color: #7dd3fc; border: 1px solid #1e3a5f; font-weight: 400; }
  .btn.ghost:hover { background: #0c1a2b; border-color: #38bdf8; color: #a5e8ff; }
  .err {
    display: none; background: #3b1219; border: 1px solid #7f1d1d; color: #fca5a5;
    padding: 10px 14px; font-size: 13px; margin-bottom: 12px;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .stat { background: #111827; border: 1px solid #1f2937; padding: 10px 16px; min-width: 150px; }
  .stat .k { font-size: 11px; color: #64748b; letter-spacing: 1px; }
  .stat .v { font-size: 20px; color: #e2e8f0; font-weight: 700; margin-top: 2px; }
  .stat .v small { font-size: 12px; color: #64748b; font-weight: 400; }
  .list { border: 1px solid #1f2937; }
  /* 列表区提示（如该链无公共地址索引） */
  .listnote {
    border: 1px solid #78350f; background: #1c1207; color: #fbbf24;
    padding: 16px; font-size: 13px; line-height: 1.9;
  }
  .lhead, .row {
    display: grid; grid-template-columns: 52px 130px 150px 120px 90px 170px 90px 110px;
    gap: 8px; padding: 9px 14px; align-items: center; font-size: 12.5px;
  }
  .lhead { background: #111827; color: #64748b; letter-spacing: 1px; font-size: 11px; border-bottom: 1px solid #1f2937; }
  .row { border-bottom: 1px solid #17202c; cursor: pointer; }
  .row:hover { background: #0f1a26; }
  .row.pending { opacity: 0.75; }
  .c-dim { color: #64748b; }
  .c-blue { color: #7dd3fc; }
  .c-amber { color: #fbbf24; }
  .mono { word-break: break-all; }
  .dir { font-size: 11px; padding: 1px 8px; border: 1px solid; }
  .dir.in { color: #34d399; border-color: #065f46; }
  .dir.out { color: #fbbf24; border-color: #78350f; }
  .dir.self { color: #c084fc; border-color: #581c87; }
  .badge {
    font-size: 10px; padding: 1px 6px; border: 1px solid #78350f; color: #fbbf24;
    background: #1c1207; white-space: nowrap;
  }
  .badge.html { border-color: #1e3a5f; color: #7dd3fc; background: #0c1a2b; }
  .badge.list { border-color: #065f46; color: #34d399; background: #052e22; }
  /* 索引墙 / 徽标的分类着色（与 web-index.html 一致） */
  .badge.cat-page { border-color: #1e3a5f; color: #7dd3fc; background: #0c1a2b; }
  .badge.cat-tool { border-color: #065f46; color: #34d399; background: #052e22; }
  .badge.cat-game { border-color: #581c87; color: #c084fc; background: #2e1065; }
  .badge.cat-experiment { border-color: #78350f; color: #fbbf24; background: #1c1207; }
  .badge.cat-other { border-color: #1f2937; color: #94a3b8; background: #111827; }
  a { color: #7dd3fc; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .more { margin-top: 12px; text-align: center; }
  .more .note { font-size: 12px; color: #475569; margin-top: 8px; }
  .chain-tag { display: inline-flex; align-items: center; gap: 7px; }
  .chain-tag .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chain-tag .ttype { font-size: 10px; padding: 0 5px; border: 1px solid #1f2937; color: #64748b; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    background: transparent; border: 1px solid #1f2937; color: #94a3b8;
    padding: 5px 14px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .tabs button.on { background: #0c2233; color: #7dd3fc; border-color: #1e3a5f; }
  .pane { display: none; }
  .pane.on { display: block; }
  .pane pre {
    background: #060a0f; border: 1px solid #17202c; padding: 14px; font-size: 12px;
    color: #a7f3d0; max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  .pane .hex { color: #7dd3fc; }
  .nodata { padding: 20px 16px; color: #64748b; font-size: 13px; }
  .dtools { display: flex; gap: 8px; flex-wrap: wrap; }
  .dtools .btn { padding: 5px 12px; font-size: 12px; }
  .loading { padding: 30px; text-align: center; color: #64748b; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; border: 2px solid #1e3a5f;
    border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .hrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .hacts { display: flex; gap: 8px; flex-wrap: wrap; }
  /* ---------- 使用说明面板 ---------- */
  .help-panel {
    border: 1px solid #1e3a5f; background: #0d141c; padding: 16px 20px; margin-bottom: 20px;
    font-size: 13px; line-height: 1.9; color: #94a3b8;
  }
  .help-panel h3 { color: #7dd3fc; font-size: 13px; letter-spacing: 1px; margin: 16px 0 6px; }
  .help-panel h3:first-child { margin-top: 0; }
  .help-panel b { color: #cbd5e1; }
  .help-panel code {
    background: #060a0f; border: 1px solid #17202c; padding: 1px 6px; color: #a7f3d0;
    font-size: 12px; word-break: break-all;
  }
  .help-panel ul { list-style: none; padding: 0; }
  .help-panel li { padding: 2px 0; }
  .help-panel .chain-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 18px; margin-top: 6px; }
  .help-panel .chain-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; }
  .help-panel .chain-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .help-panel .chain-item .cid { color: #475569; font-size: 11px; }
  /* ---------- 沉浸式详情：全屏链上网页 ---------- */
  #immerse {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    border: 0; background: #fff; z-index: 1; display: block;
  }
  .bro-btn {
    position: fixed; left: 18px; bottom: 18px; z-index: 40;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #155e75, #0e7490); color: #cffafe;
    border: 1px solid #38bdf8; font: inherit; font-size: 15px; font-weight: 700;
    letter-spacing: .5px; cursor: pointer;
    box-shadow: 0 6px 22px rgba(56, 189, 248, .28);
  }
  .bro-btn:hover { background: linear-gradient(135deg, #0e7490, #0891b2); color: #ecfeff; }
  .bro-mask { position: fixed; inset: 0; z-index: 38; background: rgba(2, 6, 10, .5); }
  .bro-panel {
    position: fixed; left: 18px; bottom: 86px; z-index: 39;
    width: min(440px, calc(100vw - 36px)); max-height: min(600px, calc(100vh - 120px));
    display: flex; flex-direction: column;
    background: #0d141c; border: 1px solid #1e3a5f; box-shadow: 0 12px 40px rgba(2, 6, 10, .6);
  }
  .bro-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #1e3a5f; background: #0f1a26; flex: none;
  }
  .bro-title { font-size: 13px; color: #7dd3fc; letter-spacing: 1px; }
  .bro-x {
    background: transparent; border: 1px solid #1f2937; color: #94a3b8;
    width: 26px; height: 26px; font: inherit; font-size: 12px; cursor: pointer; flex: none;
  }
  .bro-x:hover { border-color: #38bdf8; color: #a5e8ff; }
  .bro-body { overflow: auto; padding: 14px; }
  .bro-index { border: 1px solid #065f46; background: #052e22; padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; color: #34d399; line-height: 1.8; }
  .bro-index .t { color: #e2e8f0; font-size: 13px; }
  .bro-index .cat { font-size: 10px; padding: 1px 6px; border: 1px solid #065f46; color: #34d399; background: #064e3b; margin-left: 6px; }
  .bro-index .m { color: #64748b; font-size: 11px; }
  .bro-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 16px; }
  .bro-meta .item .k { font-size: 11px; color: #64748b; }
  .bro-meta .item .v { font-size: 12.5px; color: #cbd5e1; word-break: break-all; }
  .bro-note { font-size: 11.5px; color: #64748b; margin-top: 10px; }
  .bro-panel .dtools { padding: 12px 0 0; }
  .bro-panel .dtools .btn { padding: 5px 12px; font-size: 12px; }
  .bro-panel .tabs { padding: 12px 0 0; }
  .bro-panel .pane { padding: 10px 0 0; display: none; }
  .bro-panel .pane.on { display: block; }
  .bro-panel .pane pre {
    background: #060a0f; border: 1px solid #17202c; padding: 12px; font-size: 11.5px;
    color: #a7f3d0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }
  .bro-panel .pane .hex { color: #7dd3fc; }
  .bro-foot { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; border-top: 1px solid #17202c; flex: none; }
  .bro-foot .btn { padding: 6px 12px; font-size: 12px; }
  /* ---------- 网页索引墙（方块） ---------- */
  #wall-ui { margin-top: 24px; }
  #wall-ui .dim { color: #475569; font-weight: 400; font-size: 12px; }
  .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .tile {
    border: 1px solid #1f2937; background: #0f1a26; padding: 14px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px; min-height: 118px;
    transition: border-color .15s, transform .15s;
  }
  .tile:hover { border-color: #38bdf8; transform: translateY(-2px); }
  .tile .tcat { display: flex; align-items: center; gap: 8px; }
  .tile .tname { font-size: 14px; color: #e2e8f0; line-height: 1.5; word-break: break-all; }
  .tile .tmeta { margin-top: auto; font-size: 11px; color: #64748b; display: flex; justify-content: space-between; gap: 8px; }
  .tile .tmeta .mono { word-break: break-all; }
  @media (max-width: 860px) {
    .lhead { display: none; }
    .row { grid-template-columns: 1fr 1fr; row-gap: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow">
      <h1>◈ ON-CHAIN BROWSER <span class="dim" id="subtitle">// 链上浏览器</span></h1>
      <div class="hacts">
        <button class="btn" id="deploy-btn" title="打开发布页：粘贴网页源码，通过 MetaMask 或私钥发布上链">部署网页 ↗</button>
        <button class="btn ghost" id="help-btn">使用说明</button>
        <button class="btn ghost" id="lang-btn">EN</button>
      </div>
    </div>
    <div class="netline" id="netline">正在连接网络 ...</div>
  </header>

  <!-- 使用说明（默认折叠，点击「使用说明」展开） -->
  <div id="help-panel" class="help-panel hidden"></div>

  <!-- 列表模式 -->
  <div id="list-ui">
    <div class="query">
      <select id="net-sel" title="网络选择"></select>
      <input id="addr" spellcheck="false" autocomplete="off"
        value="0x0000000000000000000000000000000666666666"
        placeholder="链ID:交易哈希（如 11155111:0x…）· 地址 · 交易哈希">
      <button id="go">检索</button>
    </div>
    <div class="err" id="err"></div>
    <div class="stats" id="stats"></div>
    <div class="list" id="list"></div>
    <div class="more" id="more"></div>

    <!-- 网页索引墙（WebIndex 合约收录，方块墙排列） -->
    <section id="wall-ui" class="panel hidden">
      <div class="panel-h"><span><b id="wall-title"></b> <span class="dim" id="wall-dim"></span></span>
        <span class="hacts">
          <button class="btn ghost" id="wall-refresh"></button>
          <a class="btn ghost" id="wall-submit-link" href="web-index.html" target="_blank" rel="noopener"></a>
        </span>
      </div>
      <div class="panel-b"><div class="wall" id="wall"></div></div>
    </section>
  </div>

  <!-- 交易详情模式：沉浸式——全屏只渲染链上网页本身，链上信息收进左下角 Bro 悬浮按钮 -->
  <div id="detail-ui" class="hidden">
    <iframe id="immerse" title="链上网页" sandbox="allow-scripts"></iframe>
    <button id="bro-btn" class="bro-btn" title="Bro"></button>
    <div id="bro-mask" class="bro-mask hidden"></div>
    <div id="bro-panel" class="bro-panel hidden">
      <div class="bro-head">
        <span class="bro-title" id="bro-title"></span>
        <button id="bro-close" class="bro-x">✕</button>
      </div>
      <div class="bro-body">
        <div id="bro-index" class="bro-index hidden"></div>
        <div class="bro-meta" id="bro-meta"></div>
        <div id="bro-note" class="bro-note"></div>
        <div class="dtools" id="bro-tools"></div>
        <div class="tabs" id="bro-tabs"></div>
        <div class="pane" id="bro-src"></div>
        <div class="pane" id="bro-hex"></div>
      </div>
      <div class="bro-foot">
        <button class="btn ghost" id="dback"></button>
        <button class="btn ghost" id="dshare"></button>
        <a class="btn ghost" id="dext" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ==================== 网络配置（来自 networks.js） ==================== */
  var NETWORKS = window.NETWORKS || {};
  var CHAIN_KEY = 'cb_chain'; // 网络选择框的 localStorage 记忆键
  var DEFAULT_ADDR = '0x0000000000000000000000000000000666666666';
  var PAGE_SIZE = 20;
  var LANG_KEY = 'cb_lang';

  function defaultChain() {
    for (var k in NETWORKS) { if (NETWORKS[k].default) return k; }
    return '0xaa36a7';
  }
  function chainMeta(chainId) { return NETWORKS[String(chainId || '').toLowerCase()] || null; }
  function chainName(cid) {
    var n = chainMeta(cid);
    return n ? n.name : String(cid);
  }
  // 地址列表 API：读 networks.js 的 api 字段（Blockscout API v2，免密钥 + CORS 放行）；
  // 留空的链没有公共地址索引，纯 RPC 无法枚举地址的普通转账
  function listApi(cid) {
    var n = chainMeta(cid);
    return (n && n.api) || null;
  }
  // 当前浏览链：网络选择框的值（无效则回退默认链）
  function currentChain() {
    var v = '';
    try { v = $('net-sel').value; } catch (e) { /* DOM 未就绪 */ }
    return chainMeta(v) ? v.toLowerCase() : defaultChain();
  }

  /* ==================== 网页索引合约（WebIndex，只读） ==================== */
  // 配置了 webIndex 的链即索引合约所在链（当前为 Sepolia）；读它只需要 eth_call
  var WI_SEL = { recent: '0x41d41daf', byHash: '0xc25c507b' };
  function indexChainCid() {
    for (var k in NETWORKS) { if (NETWORKS[k].webIndex) return k; }
    return null;
  }
  function catLabel(cat) {
    var m = { page: 'catPage', tool: 'catTool', game: 'catGame', experiment: 'catExperiment', other: 'catOther' };
    return m[cat] ? t(m[cat]) : cat;
  }
  function wiHexToUtf8(d, fromHexChar, len) {
    var s = '';
    for (var j = 0; j < len;) {
      var b1 = parseInt(d.substr(fromHexChar + j * 2, 2), 16);
      if (b1 < 0x80) { s += String.fromCharCode(b1); j += 1; }
      else if (b1 < 0xe0) { s += String.fromCharCode(((b1 & 0x1f) << 6) | (parseInt(d.substr(fromHexChar + (j + 1) * 2, 2), 16) & 0x3f)); j += 2; }
      else if (b1 < 0xf0) { s += String.fromCharCode(((b1 & 0x0f) << 12) | ((parseInt(d.substr(fromHexChar + (j + 1) * 2, 2), 16) & 0x3f) << 6) | (parseInt(d.substr(fromHexChar + (j + 2) * 2, 2), 16) & 0x3f)); j += 3; }
      else {
        var cp = ((b1 & 0x07) << 18) | ((parseInt(d.substr(fromHexChar + (j + 1) * 2, 2), 16) & 0x3f) << 12) | ((parseInt(d.substr(fromHexChar + (j + 2) * 2, 2), 16) & 0x3f) << 6) | (parseInt(d.substr(fromHexChar + (j + 3) * 2, 2), 16) & 0x3f);
        cp -= 0x10000;
        s += String.fromCharCode(0xd800 + (cp >> 10), 0xdc00 + (cp & 0x3ff));
        j += 4;
      }
    }
    return s;
  }
  // recent() 返回扁平六数组（已与 ethers 官方解码逐字段比对）
  function wiDecodeFlat(hex) {
    var d = String(hex).replace(/^0x/, '');
    function word(i) { return d.slice(i * 64, i * 64 + 64); }
    function num(i) { return parseInt(word(i), 16); }
    function arrBase(w) { return num(w) / 32; }
    function strAt(w) { return wiHexToUtf8(d, (w + 1) * 64, num(w)); }
    function fixedArr(w) {
      var base = arrBase(w), len = num(base), out = [];
      for (var i = 0; i < len; i++) out.push(word(base + 1 + i));
      return out;
    }
    function strArr(w) {
      var base = arrBase(w), len = num(base), out = [];
      for (var i = 0; i < len; i++) out.push(strAt(base + 1 + num(base + 1 + i) / 32));
      return out;
    }
    return {
      hashes: fixedArr(0).map(function (x) { return '0x' + x; }),
      chainIds: fixedArr(1).map(function (x) { return parseInt(x, 16); }),
      titles: strArr(2),
      cats: strArr(3),
      authors: fixedArr(4).map(function (x) { return '0x' + x.slice(24); }),
      times: fixedArr(5).map(function (x) { return parseInt(x, 16); })
    };
  }
  // byHash() 返回 (bool,bytes32,uint64,string,string,address,uint64)
  function wiDecodeByHash(hex) {
    var d = String(hex).replace(/^0x/, '');
    function word(i) { return d.slice(i * 64, i * 64 + 64); }
    function num(i) { return parseInt(word(i), 16); }
    function strAt(w) { return wiHexToUtf8(d, (w + 1) * 64, num(w)); }
    return {
      found: num(0) === 1, hash: word(1), chainId: num(2),
      title: strAt(num(3) / 32), category: strAt(num(4) / 32),
      author: '0x' + word(5).slice(24), time: num(6)
    };
  }
  function wiStoreCall(data) {
    var cid = indexChainCid();
    if (!cid) return Promise.reject(new Error('NO_WEBINDEX'));
    var addr = chainMeta(cid).webIndex;
    return rpcCall(cid, 'eth_call', [{ to: addr, data: data }, 'latest']);
  }
  function wiRecent(count) {
    return wiStoreCall(WI_SEL.recent + count.toString(16).padStart(64, '0')).then(function (j) {
      if (j.error) throw new Error(j.error.message || 'call failed');
      return wiDecodeFlat(j.result);
    });
  }
  function wiByHash(hash) {
    return wiStoreCall(WI_SEL.byHash + String(hash).replace(/^0x/, '')).then(function (j) {
      if (j.error) throw new Error(j.error.message || 'call failed');
      return wiDecodeByHash(j.result);
    });
  }

  /* ---------- 索引墙（列表模式底部方块） ---------- */
  var wallEntries = [];
  var wallLoaded = false;
  function loadWall(force) {
    if (wallLoaded && !force) { renderWall(); return; }
    var box = $('wall');
    box.innerHTML = '';
    box.appendChild(el('div', 'loading', '<span class="spinner"></span>' + t('wallLoading')));

  function fetchJSON(url) {
    return fetch(url, { headers: { 'accept': 'application/json' } }).then(function (r) {
      if (r.status === 429) throw new Error('RATE_LIMIT');
      if (!r.ok) throw new Error('HTTP_' + r.status);
      return r.json();
    });

  /* 任意链的 RPC 调用（免密钥公共端点） */
  function rpcCall(chainId, method, params) {
    var net = chainMeta(chainId);
    if (!net) return Promise.reject(new Error('UNKNOWN_CHAIN'));
    return fetch(net.rpc, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: method, params: params })
    }).then(function (r) { return r.json(); });
  }

  // 校验交易哈希是否存在：RPC 为主，Blockscout 复核（防节点未同步，仅配置了列表 API 的链有 Blockscout）
  function checkTxExists(chainId, hash) {
    var api = listApi(chainId);
    return rpcCall(chainId, 'eth_getTransactionByHash', [hash]).then(function (j) {
      if (j.error) throw new Error('rpc');
      if (j.result) return true;
      if (api) {
        return fetchJSON(api + '/transactions/' + hash).then(function (jt) { return !!jt.hash; })
          .catch(function () { return false; });
      }
      return false;
    }).catch(function () {
      if (api) {
        return fetchJSON(api + '/transactions/' + hash).then(function (jt) { return !!jt.hash; })
          .catch(function () { throw new Error('lookup'); });
      }
      throw new Error('lookup');
    });
  }

  function checkNetwork() {
    var cid = currentChain();
    rpcCall(cid, 'eth_chainId', []).then(function (j) {
      var n = $('netline');
      n.innerHTML = '';
      if (j && j.result) {
        // 正常连接：不显示状态说明（界面保持干净，直接看内容）
        n.classList.add('hidden');
      } else {
        n.classList.remove('hidden');
        var net = chainMeta(cid);
        n.appendChild(el('span', 'bad', t('netBad', { cid: parseInt(cid, 16) })));
      }
    }).catch(function () {
      var n = $('netline');
      n.innerHTML = '';
      n.classList.remove('hidden');
      n.appendChild(el('span', 'bad', t('netDown')));
    });
  }

  /* ==================== 检索解析 ==================== */
  // '11155111' → '0xaa36a7'；'0xAA36A7' → '0xaa36a7'；无效返回 null
  function normalizeChainId(s) {
    if (/^\d+$/.test(s)) {
      var n = parseInt(s, 10);
      if (n > 0 && n < 1e15) return '0x' + n.toString(16);
      return null;
    }
    if (/^0x[0-9a-fA-F]+$/.test(s)) return s.toLowerCase();
    return null;
  }

  // 解析检索输入：链ID+哈希 / 地址 / 哈希
  function parseQuery(q) {
    q = String(q || '').trim();
    var parts = q.split(/[\s,:;|#@]+/).filter(function (s) { return s.length > 0; });
    if (parts.length >= 2 && isTxHash(parts[parts.length - 1])) {
      var cid = normalizeChainId(parts[0]);
      if (cid) return { type: 'chainTx', chainId: cid, hash: parts[parts.length - 1] };
    }
    if (isAddr(q)) return { type: 'addr' };
    if (isTxHash(q)) return { type: 'tx', chainId: currentChain(), hash: q };
    return { type: 'invalid' };
  }

  /* ==================== 路由：列表模式 / 交易详情模式 ==================== */
  // #tx=<chainId>:<hash> 或 #tx=<hash>（默认链）
  function parseTxParam(param) {
    var parts = String(param || '').split(':');
    if (parts.length === 2 && isTxHash(parts[1])) {
      var cid = normalizeChainId(parts[0]);
      if (cid) return { chainId: cid, hash: parts[1] };
      return null;
    }
    if (isTxHash(param)) return { chainId: currentChain(), hash: param };
    return null;
  }

  function route() {
    var h = location.hash;
    if (h.indexOf('#tx=') === 0 && h.length > 4) {
      showDetailMode(h.slice(4));
    } else {
      showListMode();
    }
  }

  function showListMode() {
    state.tx = null;
    closeBro();
    try { $('immerse').srcdoc = ''; } catch (e) {}
    $('detail-ui').classList.add('hidden');
    $('list-ui').classList.remove('hidden');
    $('subtitle').textContent = t('subtitle');
    document.title = t('docTitle');
    if (!state.loadedOnce) {
      state.loadedOnce = true;
      load(DEFAULT_ADDR, null, false);
    }
    loadWall(); // 索引墙（首次加载；随后走缓存，点「刷新」强制重读）
  }

  function showDetailMode(param) {
    var parsed = parseTxParam(param);
    $('list-ui').classList.add('hidden');
    $('detail-ui').classList.remove('hidden');
    if (!parsed) {
      state.tx = null;
      $('subtitle').textContent = t('subtitle');
      document.title = t('docTitle');
      closeBro();
      $('bro-note').textContent = t('errInvalid');
      $('immerse').srcdoc = noticePageHtml(t('errInvalid'));
      openBro(); // 参数非法时展开面板说明
      return;
    }
    state.tx = { chainId: parsed.chainId, hash: parsed.hash };
    var net = chainMeta(parsed.chainId);
    $('subtitle').textContent = '// ' + (net ? net.name : parsed.chainId);
    // 标签标题默认「TX 短哈希 · 站点名」；链上数据加载后若含 <title> 会替换为网页标题
    document.title = t('txTitle', { hash: short(parsed.hash) }) + ' · ' + t('docTitle');
    renderDetail(parsed.chainId, parsed.hash);
  }

  /* ---------- Bro 信息面板（左下角悬浮按钮的弹窗） ---------- */
  function openBro() {
    $('bro-panel').classList.remove('hidden');
    $('bro-mask').classList.remove('hidden');
    $('bro-btn').textContent = '✕';
  }
  function closeBro() {
    $('bro-panel').classList.add('hidden');
    $('bro-mask').classList.add('hidden');
    $('bro-btn').textContent = t('broBtn');
  }
  function toggleBro() {
    if ($('bro-panel').classList.contains('hidden')) openBro(); else closeBro();
  }
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // 沉浸式 iframe 内的「外壳页」：无 data / 读取失败时也保持全屏网页的观感
  function noticePageHtml(msg) {
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' +
      'html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;' +
      'background:#0b0f14;color:#94a3b8;font:14px/1.9 "JetBrains Mono",Consolas,monospace;text-align:center;padding:24px}</style></head>' +
      '<body><div>' + escHtml(msg) + '</div></body></html>';
  }
  function textPageHtml(text) {
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' +
      'html,body{margin:0;padding:0}body{background:#fff;color:#1f2937;' +
      'font:13px/1.75 "JetBrains Mono",Consolas,monospace;padding:28px;white-space:pre-wrap;word-break:break-all}</style></head>' +
      '<body>' + escHtml(text) + '</body></html>';
  }

  /* ==================== 列表模式（所选链 · Blockscout 索引） ==================== */
  function openTx(hash) {
    window.open(baseUrl() + '#tx=' + currentChain() + ':' + hash, '_blank');
  }

  function load(addr, cursor, keepOld) {
    if (state.loading) return;
    var api = listApi(currentChain());
    if (!api) {
      // 该链没有配置地址列表 API（networks.js 无 api 字段）——列表区给出明确提示（i18n 键 + 变量，切语言即时更新）
      state.errNote = { key: 'errNoListApi', vars: { chain: chainName(currentChain()) } };
      render();
      return;
    }
    state.errNote = null;
    state.loading = true;
    hideErr();
    if (!keepOld) {
      state.items = []; state.cursor = null; state.counters = null; state.pageSize = null;
      $('list').innerHTML = '';
      $('stats').innerHTML = '';
      $('more').innerHTML = '';
      state.addr = addr;
      $('list').appendChild(el('div', 'loading', '<span class="spinner"></span>' + t('loadingList', { addr: short(addr) })));
    } else {
      $('more').innerHTML = '<span class="spinner"></span>';
    }

    // 每页固定 20 条；Blockscout 的翻页游标不回带 items_count，需每次显式携带
    var p = ['items_count=' + PAGE_SIZE];
    if (cursor) {
      for (var k in cursor) {
        if (k === 'items_count') continue;
        if (cursor[k] !== null && cursor[k] !== undefined) p.push(encodeURIComponent(k) + '=' + encodeURIComponent(cursor[k]));
      }
    }
    var listUrl = api + '/addresses/' + addr + '/transactions?' + p.join('&');

    Promise.all([
      fetchJSON(api + '/addresses/' + addr + '/counters'),
      fetchJSON(listUrl)
    ]).then(function (res) {
      state.counters = res[0];
      var page = res[1];
      state.items = keepOld ? state.items.concat(page.items || []) : (page.items || []);
      state.cursor = page.next_page_params || null;
      // 部分 Blockscout 实例有最小页大小（如 50）：items_count 小于最小值时被忽略，
      // 以实际返回条数作为有效页大小，保证「每页 N」与「加载更多」的计数诚实
      if (page.items && page.items.length > PAGE_SIZE) state.pageSize = page.items.length;
      render();
      state.loading = false;
    }).catch(function (e) {
      state.loading = false;
      var msg = e.message === 'RATE_LIMIT'
        ? t('errRateLimit')
        : t('errListFail', { msg: e.message });
      showErr(msg);
      if (keepOld) {
        $('more').innerHTML = '';
        var retry = el('button', 'btn', t('retryMore'));
        retry.onclick = function () { load(state.addr, state.cursor, true); };
        $('more').appendChild(retry);
      } else {
        $('list').innerHTML = '';
        $('list').appendChild(el('div', 'loading', msg));
        $('more').innerHTML = '';
      }
    });
  }

  function render() {
    var stats = $('stats');
    stats.innerHTML = '';
    var list = $('list');
    list.innerHTML = '';
    var more = $('more');
    more.innerHTML = '';
    // 列表模式在该链不可用（如无公共地址索引）：列表区给出提示，不渲染旧数据
    if (state.errNote) {
      list.appendChild(el('div', 'listnote', t(state.errNote.key, state.errNote.vars)));
      return;
    }
    var c = state.counters || {};
    function stat(k, v, unit) {
      var s = el('div', 'stat');
      s.appendChild(el('div', 'k', k));
      var vv = el('div', 'v', v);
      if (unit) vv.appendChild(el('small', null, ' ' + unit));
      s.appendChild(vv);
      stats.appendChild(s);
    }
    stat(t('statTotal'), Number(c.transactions_count || 0).toLocaleString(), '');
    stat(t('statTokens'), Number(c.token_transfers_count || 0).toLocaleString(), '');
    stat(t('statLoaded'), state.items.length, '（每页 ' + (state.pageSize || PAGE_SIZE) + '）');

    if (!state.items.length) {
      list.appendChild(el('div', 'loading', t('emptyList', { chain: chainName(currentChain()) })));
    }
    var head = el('div', 'lhead');
    t('lhead').forEach(function (x) { head.appendChild(el('span', null, x)); });
    list.appendChild(head);

    state.items.forEach(function (it, i) {
      var row = el('div', 'row' + (it.block_number == null ? ' pending' : ''));
      var selfTx = it.from && it.to && it.from.hash && it.to.hash && it.from.hash.toLowerCase() === it.to.hash.toLowerCase();
      var dir = selfTx ? 'self' : ((it.to && it.to.hash && it.to.hash.toLowerCase() === state.addr.toLowerCase()) ? 'in' : 'out');
      var other = dir === 'in' ? it.from : it.to;
      var otherHash = other && other.hash ? other.hash : '';

      row.appendChild(el('span', 'c-dim', String(i + 1)));
      row.appendChild(el('span', 'dir ' + dir, dir === 'in' ? t('dirIn') : (dir === 'self' ? t('dirSelf') : t('dirOut'))));

      var cp = el('span');
      var a = el('a', 'mono c-blue', short(otherHash));
      a.href = 'https://eth-sepolia.blockscout.com/address/' + otherHash;
      a.target = '_blank'; a.rel = 'noopener';
      a.title = otherHash;
      cp.appendChild(a);
      row.appendChild(cp);

      row.appendChild(el('span', 'mono', fmtEth(it.value)));

      var ds = el('span');
      var b = fmtBytes(it.raw_input);
      if (b !== null) {
        ds.appendChild(el('span', 'badge' + (looksLikeHtml(it.raw_input) ? ' html' : ''), t('badgeData') + ' ' + fmtSize(b)));
      } else {
        ds.appendChild(el('span', 'c-dim', '—'));
      }
      row.appendChild(ds);

      row.appendChild(el('span', 'c-dim', fmtTime(it.timestamp)));
      row.appendChild(el('span', it.block_number == null ? 'c-amber' : 'mono', it.block_number == null ? t('pending') : Number(it.block_number).toLocaleString()));

      // 哈希：真实链接，点击在新窗口打开交易详情
      var h = el('span');
      var ha = el('a', 'mono', it.hash.slice(0, 10) + '…');
      ha.href = baseUrl() + '#tx=' + currentChain() + ':' + it.hash;
      ha.target = '_blank'; ha.rel = 'noopener';
      ha.title = it.hash + t('openNewWinTitle');
      h.appendChild(ha);
      row.appendChild(h);

      row.onclick = function (e) {
        if (e.target.tagName === 'A') return;
        openTx(it.hash);
      };
      list.appendChild(row);
    });

    var more = $('more');
    more.innerHTML = '';
    if (state.cursor) {
      var btn = el('button', 'btn', t('loadMore', { n: state.pageSize || PAGE_SIZE }));
      btn.onclick = function () { load(state.addr, state.cursor, true); };
      more.appendChild(btn);
      more.appendChild(el('div', 'note', t('moreNote')));
    } else if (state.items.length) {
      more.appendChild(el('div', 'note', t('allLoaded', { n: state.items.length })));
    }
  }

  /* ==================== 交易详情模式（纯 RPC · 任意链） ==================== */
  // 从链上网页源码提取 <title>（解码常见 HTML 实体 + 截断），取不到返回 ''
  function extractDocTitle(text) {
    var m = String(text || '').match(/<title[^>]*>([\s\S]*?)<\/title>/i);
    if (!m) return '';
    var s = m[1].replace(/\s+/g, ' ').trim();
    if (!s) return '';
    var ents = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", apos: "'", nbsp: ' ' };
    s = s.replace(/&(amp|lt|gt|quot|#39|apos|nbsp);/g, function (_, e) { return ents[e] || _; });
    return s.slice(0, 80);
  }

  function renderDetail(chainId, hash) {
    var net = chainMeta(chainId);
    var ifr = $('immerse');
    // 沉浸式：打开详情即全屏加载链上网页，信息面板默认收起（点左下角 Bro 查看）
    closeBro();
    $('bro-title').textContent = t('txTitle', { hash: hash });
    $('bro-close').title = t('broClose');

    // 外链按钮：该链配置了 explorer 才显示
    var dext = $('dext');
    if (net && net.explorer) {
      dext.href = net.explorer.split('{hash}').join(hash);
      dext.textContent = net.name + ' Explorer ↗';
      dext.style.display = '';
    } else {
      dext.style.display = 'none';
    }

    // 清空信息面板各区
    $('bro-meta').innerHTML = '';
    $('bro-index').innerHTML = '';
    $('bro-index').classList.add('hidden');
    $('bro-note').textContent = '';
    $('bro-tools').innerHTML = '';
    $('bro-tabs').innerHTML = '';
    $('bro-src').innerHTML = '';
    $('bro-src').classList.remove('on');
    $('bro-hex').innerHTML = '';
    $('bro-hex').classList.remove('on');

    ifr.srcdoc = noticePageHtml(t('loadingTx'));
    state.tx = { chainId: chainId, hash: hash };
    queryIndexBadge(hash);

    // 纯 RPC 三连查：交易本体 → 区块（时间戳）→ 回执（状态/实际 gas）
    loadTxFromRpc(chainId, hash).then(function (tx) {
      if (!state.tx || state.tx.hash !== hash) return; // 已切走
      if (!tx) {
        ifr.srcdoc = noticePageHtml(t('errTxNotFound', { hash: hash.slice(0, 14), chain: net ? net.name : chainId }));
        $('bro-note').textContent = t('errTxNotFound', { hash: hash.slice(0, 14), chain: net ? net.name : chainId });
        openBro(); // 读取失败时自动展开面板，让用户看到原因
        return;
      }
      renderMeta(chainId, tx);
      renderDataViews(tx.input || '0x');
    }).catch(function () {
      if (!state.tx || state.tx.hash !== hash) return;
      ifr.srcdoc = noticePageHtml(t('errDetailFail', { chain: net ? net.name : chainId }));
      $('bro-note').textContent = t('errDetailFail', { chain: net ? net.name : chainId });
      openBro();
    });
  }

  // 详情页索引徽标：该哈希被 WebIndex 合约收录时，显示标题 + 分类 + 申报者
  function queryIndexBadge(hash) {
    if (!indexChainCid()) return;
    wiByHash(hash).then(function (r) {
      if (!state.tx || state.tx.hash !== hash || !r.found) return;
      var box = $('bro-index');
      box.innerHTML = '';
      box.appendChild(el('div', 't', t('indexHit')));
      var line = el('div', 't', r.title);
      box.appendChild(line);
      box.appendChild(el('div', 'm', t('indexCat') + ' ' + catLabel(r.category) + ' · ' + t('indexBy') + ' ' + short(r.author) + ' · ' + t('indexAt') + ' ' + fmtTime(r.time)));
      box.classList.remove('hidden');
    }).catch(function () { /* 索引查询失败静默：不影响主浏览流程 */ });
  }

  function loadTxFromRpc(chainId, hash) {
    return rpcCall(chainId, 'eth_getTransactionByHash', [hash]).then(function (j) {
      if (j.error) throw new Error('rpc');
      if (!j.result) return null; // 交易不存在
      var tx = j.result;
      var jobs = [];
      // 补时间戳
      if (tx.blockNumber) {
        jobs.push(rpcCall(chainId, 'eth_getBlockByNumber', [tx.blockNumber, false]).then(function (jb) {
          if (jb && jb.result && jb.result.timestamp) {
            tx.timestamp = parseInt(jb.result.timestamp, 16);
          }
        }).catch(function () { /* 时间戳缺失不致命 */ }));
      }
      // 补回执（状态 + gasUsed）
      if (tx.blockNumber) {
        jobs.push(rpcCall(chainId, 'eth_getTransactionReceipt', [hash]).then(function (jr) {
          if (jr && jr.result) {
            tx.status = jr.result.status;
            tx.gasUsed = jr.result.gasUsed;
          }
        }).catch(function () { /* 回执缺失不致命 */ }));
      }
      return Promise.all(jobs).then(function () { return tx; });
    });
  }

  function renderMeta(chainId, tx) {
    var meta = $('bro-meta');
    meta.innerHTML = '';
    var net = chainMeta(chainId);
    function mi(k, vNode) {
      var i = el('div', 'item');
      i.appendChild(el('div', 'k', k));
      var v = el('div', 'v mono');
      if (typeof vNode === 'string') v.textContent = vNode;
      else v.appendChild(vNode);
      i.appendChild(v);
      meta.appendChild(i);

    // 链徽标

      var dot = el('span', 'dot');
      dot.style.background = net.color || '#64748b';
      chainTag.appendChild(dot);
      chainTag.appendChild(document.createTextNode(net.name));
      chainTag.appendChild(el('span', 'ttype', net.type === 'mainnet' ? (lang === 'zh' ? '主网' : 'MAINNET') : (lang === 'zh' ? '测试网' : 'TESTNET')));
      chainTag.appendChild(document.createTextNode(' (' + parseInt(chainId, 16) + ')'));
    } else {
      chainTag.textContent = chainId;
    }
    mi(t('metaChain'), chainTag);

    mi(t('metaFrom'), tx.from || '?');
    mi(t('metaTo'), tx.to || t('contractCreate'));

    mi(t('metaBlock'), tx.blockNumber ? Number(tx.blockNumber).toLocaleString() : t('statusPending'));
    mi(t('metaTime'), tx.timestamp ? fmtTime(tx.timestamp * 1000) : t('statusPending'));
    mi(t('metaGasLimit'), tx.gas ? Number(tx.gas).toLocaleString() : '—');
    mi(t('metaGasPrice'), tx.gasPrice ? Number(tx.gasPrice).toLocaleString() : '—');
    mi(t('metaNonce'), tx.nonce !== undefined ? String(tx.nonce) : '—');
    if (tx.status === '0x1') mi(t('metaStatus'), t('statusOk'));
    else if (tx.status === '0x0') mi(t('metaStatus'), t('statusFail'));
    else if (!tx.blockNumber) mi(t('metaStatus'), t('statusPending'));
  }

  function renderDataViews(input) {
    var ifr = $('immerse');
    var bytes = hexToBytes(input);
    var b = bytes.length;

    if (!b) {
      // 无 data：全屏给出说明页，Bro 面板显示同因
      ifr.srcdoc = noticePageHtml(t('noData'));
      $('bro-note').textContent = t('noData');
      return;
    }

    var text = decodeText(bytes);
    var htmlish = /^\s*<(!doctype|html)/i.test(text) || /<\s*(html|body|head)\b/i.test(text);

    // 浏览器标签标题：链上网页自己的 <title>（有则「网页标题 · TX 短哈希」，无则保持默认 TX 标题）
    var docTitle = extractDocTitle(text);
    if (docTitle) {
      document.title = docTitle + ' · TX ' + (state.tx ? short(state.tx.hash) : '');
    }

    // 沉浸式：HTML 原样进全屏 iframe；纯文本包一层文本页，同样是全屏网页观感
    ifr.srcdoc = htmlish ? text : textPageHtml(text);
    $('bro-note').textContent = htmlish
      ? t('dataNote', { b: b, size: fmtSize(b) })
      : t('dataNotePlain', { b: b, size: fmtSize(b) });

    // 工具行（复制 HEX / 复制源码 / 下载）→ Bro 面板
    var tools = $('bro-tools');
    function toolBtn(label, fn) {
      var btn = el('button', 'btn ghost', label);
      btn.onclick = fn;
      tools.appendChild(btn);
    }
    toolBtn(t('copyHex'), function () { copy(input); });
    toolBtn(t('copySrc'), function () { copy(text); });
    if (htmlish) toolBtn(t('downloadHtml'), function () { download(text, 'onchain-payload.html'); });

    // tabs：HTML 有「源码 / 原始 HEX」，纯文本只有 HEX（文本已在全屏显示）
    var tabs = $('bro-tabs');
    var tabPanes = [];
    function addPane(paneEl, label) {
      if (!label) return;
      var btn = el('button', null, label);
      tabs.appendChild(btn);
      tabPanes.push({ btn: btn, pane: paneEl });
      btn.onclick = function () {
        tabPanes.forEach(function (p) { p.btn.classList.remove('on'); p.pane.classList.remove('on'); });
        btn.classList.add('on'); paneEl.classList.add('on');
      };
    }
    if (htmlish) {
      var pre1 = el('pre');
      pre1.textContent = text;
      $('bro-src').appendChild(pre1);
      addPane($('bro-src'), t('paneSrc'));
    }
    var pre3 = el('pre', 'hex');
    pre3.textContent = input;
    $('bro-hex').appendChild(pre3);
    addPane($('bro-hex'), t('paneHex'));
    // 默认选中第一个 tab
    if (tabPanes.length) {
      tabPanes[0].btn.classList.add('on');
      tabPanes[0].pane.classList.add('on');
    }
  }

  function looksLikeHtml(hex) {
    try {
      var bytes = hexToBytes(hex);
      var s = '';
      for (var i = 0; i < Math.min(bytes.length, 16); i++) s += String.fromCharCode(bytes[i]);
      return /^<!DOCTYPE/i.test(s) || /^<html/i.test(s);
    } catch (e) { return false; }
  }

  function hexToBytes(hex) {
    hex = String(hex || '').replace(/^0x/, '');
    var bytes = new Uint8Array(Math.floor(hex.length / 2));
    for (var i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
    return bytes;
  }

  function decodeText(bytes) {
    try {
      return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
    } catch (e) {
      var s = '';
      for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return s;
    }
  }

  function copy(txt) {
    function done() {
      var old = document.title;
      document.title = t('copied');
      setTimeout(function () { document.title = old; }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { legacy(txt); done(); });
    } else { legacy(txt); done(); }
    function legacy(x) {
      var ta = document.createElement('textarea');
      ta.value = x; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove();
    }
  }

  function download(text, name) {
    try {
      var blob = new Blob([text], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) { showErr(t('dlFail', { msg: e.message })); }
  }

  /* ==================== 使用说明面板 ==================== */
  function renderHelp() {
    var p = $('help-panel');
    p.innerHTML = '';
    function h3(s) { p.appendChild(el('h3', null, s)); }
    function div(s) { var d = el('div'); d.innerHTML = s; p.appendChild(d); }

    h3(t('helpQueryTitle'));
    var ul = el('ul');
    [t('helpQuery1'), t('helpQuery2'), t('helpQuery3')].forEach(function (s) {
      var li = el('li'); li.innerHTML = s; ul.appendChild(li);
    });
    p.appendChild(ul);

    h3(t('helpChainsTitle'));
    ['mainnet', 'testnet'].forEach(function (type) {
      var sub = el('div', null, type === 'mainnet' ? t('helpMainnet') : t('helpTestnet'));
      sub.style.cssText = 'color:#64748b;font-size:12px;margin-top:10px;letter-spacing:1px';
      p.appendChild(sub);
      var grid = el('div', 'chain-grid');
      Object.keys(NETWORKS).forEach(function (cid) {
        var n = NETWORKS[cid];
        if (n.type !== type) return;
        var item = el('div', 'chain-item');
        var dot = el('span', 'dot');
        dot.style.background = n.color || '#64748b';
        item.appendChild(dot);
        item.appendChild(document.createTextNode(n.name));
        item.appendChild(el('span', 'cid', parseInt(cid, 16)));
        // 配置了 Blockscout 地址列表 API 的链加标注
        if (n.api) item.appendChild(el('span', 'badge list', t('helpListBadge')));
        grid.appendChild(item);
      });
      p.appendChild(grid);
    });

    h3(t('helpPublishTitle'));
    div(t('helpPublish'));

    h3(t('helpWallTitle'));
    div(t('helpWall'));

    h3(t('helpDataTitle'));
    div(t('helpData'));
  }

  function toggleHelp() {
    state.helpOpen = !state.helpOpen;
    $('help-panel').classList.toggle('hidden', !state.helpOpen);
    if (state.helpOpen) renderHelp();
  }

  /* ==================== 语言切换 ==================== */
  function applyLang() {
    $('lang-btn').textContent = t('langBtn');
    $('help-btn').textContent = t('helpBtn');
    $('deploy-btn').textContent = t('deployBtn');
    $('go').textContent = t('search');
    $('addr').placeholder = t('placeholder');
    $('dback').textContent = t('dback');
    $('dshare').textContent = t('dshare');
    $('bro-btn').textContent = $('bro-panel').classList.contains('hidden') ? t('broBtn') : '✕';
    $('bro-btn').title = t('broTitle');
    $('bro-close').title = t('broClose');
    $('wall-title').textContent = t('wallTitle');
    $('wall-dim').textContent = t('wallDim');
    $('wall-refresh').textContent = t('wallRefresh');
    $('wall-submit-link').textContent = t('wallSubmit');
    fillNetSelect(); // 选择框分组标签随语言刷新（选中项从 localStorage 恢复，不丢失）
    document.title = t('docTitle');
    if (state.helpOpen) renderHelp();
  }

  // 即时切换语言（不刷新页面）：重渲染当前模式
  function setLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* 隐私模式 */ }
    applyLang();
    checkNetwork();
    if (state.tx) {
      renderDetail(state.tx.chainId, state.tx.hash);
    } else if (state.loadedOnce && !$('list-ui').classList.contains('hidden')) {
      render();
    }
  }

  /* ==================== 事件 ==================== */
  function onSearch() {
    // 空输入兜底为广场地址（与首屏默认检索一致）
    var q = $('addr').value.trim() || DEFAULT_ADDR;
    hideErr();
    var parsed = parseQuery(q);
    if (parsed.type === 'addr') {
      state.loadedOnce = false;
      load(q, null, false);
      return;
    }
    if (parsed.type === 'tx' || parsed.type === 'chainTx') {
      var net = chainMeta(parsed.chainId);
      if (!net) {
        showErr(t('errUnknownChain', { cid: parsed.chainId }));
        return;
      }
      var btn = $('go');
      btn.disabled = true;
      checkTxExists(parsed.chainId, parsed.hash).then(function (ok) {
        btn.disabled = false;
        if (ok) {
          window.open(baseUrl() + '#tx=' + parsed.chainId + ':' + parsed.hash, '_blank');
        } else {
          showErr(t('errTxNotFound', { hash: parsed.hash.slice(0, 14), chain: net.name }));
        }
      }).catch(function () {
        btn.disabled = false;
        showErr(t('errTxLookupFail'));
      });
      return;
    }
    showErr(t('errInvalid'));
  }

  $('go').onclick = onSearch;
  // 网络选择：切换后记忆选择，并用新链重新检索输入框内容
  // （哈希 → 该链 RPC 直查开详情；地址 → 仅默认链有列表，其他链给出提示；「链ID:哈希」以输入为准）
  $('net-sel').addEventListener('change', function () {
    var cid = $('net-sel').value;
    try { localStorage.setItem(CHAIN_KEY, cid); } catch (e) { /* 隐私模式 */ }
    checkNetwork(); // 探测新链 RPC 连通性（异常才显示 netline）
    onSearch();
  });
  $('deploy-btn').onclick = function () { window.open('deploy.html', '_blank'); };
  $('help-btn').onclick = toggleHelp;
  $('lang-btn').onclick = function () { setLang(lang === 'zh' ? 'en' : 'zh'); };
  $('addr').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('go').click(); });
  // Bro 悬浮按钮：点开/关闭链上信息面板（Esc 或点遮罩也可关闭）
  $('bro-btn').onclick = toggleBro;
  $('bro-close').onclick = closeBro;
  $('bro-mask').onclick = closeBro;
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBro(); });
  $('wall-refresh').onclick = function () { loadWall(true); };
  // 分享：复制当前页面网址（含 #tx= 路由参数），发给别人打开即直达该交易详情
  $('dshare').onclick = function () { copy(location.href); };
  $('dback').onclick = function () {
    state.tx = null;
    history.replaceState(null, '', baseUrl());
    route();
  };
  window.addEventListener('hashchange', route);

  /* ==================== 启动 ==================== */
  applyLang();
  checkNetwork();
  route();
})();
</script>
</body>
</html>
