<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>旅游图鉴·大千世界 | 旅行收集游戏</title>
<meta name="description" content="出生武汉的旅行收集游戏：景点打卡、特色周边、奇闻趣事，走遍中国，环游世界！">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="top-title">🧳 旅游图鉴·大千世界</div>
    <div class="top-stats">
      <span class="stat money" title="旅行基金">💰 <b id="hud-money">0</b></span>
      <span class="stat" title="外币现金" style="display:none">💱 <b id="hud-cash">—</b></span>
      <span class="stat" title="所在城市">📍 <b id="hud-city">武汉</b></span>
      <span class="stat" title="图鉴收集进度">📖 <b id="hud-progress">0/0</b></span>
      <button id="btn-reset" title="重新开始">🔄</button>
    </div>
  </header>

  <nav id="tabs">
    <button class="tab active" data-tab="city">本城</button>
    <button class="tab" data-tab="map">世界</button>
    <button class="tab" data-tab="book">收集</button>
    <button class="tab" data-tab="bag">背包</button>
    <button class="tab" data-tab="office">事务所</button>
  </nav>

  <main id="view"></main>

  <footer id="footbar">本游戏价格参考现实物价 · 收益仅为游戏数值 · 图鉴点亮即获旅行基金</footer>
</div>

<div id="toast-wrap"></div>
<div id="modal-wrap" class="hidden"></div>

<!-- 数据：由 tools/build_data.js 把 data/** 按 data-order.txt 的顺序合并为 data-bundle.js（首屏 1 个请求） -->
<script src="data-bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
