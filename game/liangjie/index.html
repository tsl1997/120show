<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111713">
  <title>两界搬运工 · 重制版</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="modern-world">
  <header class="mast">
    <div class="brand">
      <div class="seal" aria-hidden="true">界</div>
      <div>
        <h1>两界搬运工</h1>
        <div class="subtitle">一扇门，两本账，四十六年的价差</div>
      </div>
    </div>
    <nav class="world-switch" aria-label="世界状态">
      <button type="button" class="world-tab active" data-world="modern" disabled>现代 · 2026</button>
      <button type="button" class="world-tab" data-world="old" disabled>旧时 · 1980</button>
    </nav>
    <div class="savebox">
      <strong id="topWealth">现代净资产 ¥3,000</strong>
      <span id="saveIndicator">两界时间加载中……</span>
      <span class="tiny">所有数据仅保存在此浏览器</span>
    </div>
  </header>

  <main class="dash">
    <aside class="rail" aria-label="地点地图">
      <div class="section-title"><span id="mapTitle">北京 · 街巷</span><small id="mapCount"></small></div>
      <div class="map-list" id="mapList"></div>
      <div class="route">
        <strong>当前落脚点</strong><br><span id="homeText"></span><br><span id="homeStats"></span>
      </div>
    </aside>

    <section class="workbench" aria-label="经营终端">
      <div class="status-line" id="statusLine"></div>
      <div id="survivalWarn" class="survival-warn"></div>
      <div class="location-head">
        <div><h2 id="locationName">当前位置</h2><p id="locationDesc"></p></div>
        <div class="actions" id="quickActions"></div>
      </div>
      <div id="content"></div>
    </section>

    <aside class="cargo" aria-label="行李与记录">
      <section aria-label="物品管理">
        <div class="section-title"><span>物品流转</span><small id="bagSummary"></small></div>
        <div id="inventory"></div>
      </section>
      <section class="cross-box" aria-label="穿越控制">
        <strong id="crossTitle">衣柜后的门</strong>
        <p id="crossHint"></p>
        <button type="button" class="primary" id="crossBtn">穿越至 1980 年</button>
      </section>
      <section class="logbook" aria-label="行动日志">
        <div class="section-title"><span>双界日志</span><small>最近 30 条</small></div>
        <ol class="logs" id="logs"></ol>
        <div class="footer-tools">
          <button type="button" id="manualSave">立即存档</button>
          <button type="button" class="danger" id="resetGame">重置存档</button>
        </div>
      </section>
    </aside>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/data/items.js"></script>
  <script src="js/data/world.js"></script>
  <script src="js/data/culture.js"></script>
  <script src="js/data/markets.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/engine.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/modules/survival.js"></script>
  <script src="js/modules/travel.js"></script>
  <script src="js/modules/trade.js"></script>
  <script src="js/modules/finance.js"></script>
  <script src="js/modules/career.js"></script>
  <script src="js/modules/antique.js"></script>
  <script src="js/modules/social.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
