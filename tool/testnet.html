<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testnet Info · 120.show</title>
  <style>
    :root {
      --bg1: #fff8ff;
      --bg2: #eef8ff;
      --bg3: #fffef3;
      --text: #314069;
      --sub: #6d7ca6;
      --line: #dbe6ff;
      --pink: #ff7cb4;
      --peach: #ffb37c;
      --blue: #79b5ff;
      --mint: #71d9c4;
      --lavender: #b59cff;
      --card-bg: rgba(255,255,255,0.86);
      --sep-a: #7fb3ff;
      --sep-b: #5b8ff9;
      --hoodi-a: #71d9c4;
      --hoodi-b: #3fb3a1;
      --lts-sep: #8b7cf6;
      --lts-hoodi: #3fb3a1;
      --now: #e8536d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at 12% 14%, rgba(255,179,124,0.28) 0, transparent 28%),
        radial-gradient(circle at 86% 9%, rgba(181,156,255,0.26) 0, transparent 30%),
        radial-gradient(circle at 76% 82%, rgba(121,181,255,0.22) 0, transparent 33%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 52%, var(--bg3));
      min-height: 100vh;
    }
    .wrap {
      max-width: 1160px;
      margin: 0 auto;
      padding: 22px 18px 70px;
    }
    .hero {
      background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(248,252,255,0.86));
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 16px 40px rgba(131,152,206,0.2);
      padding: 24px;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 28px;
      font-weight: 900;
      color: #2d3f69;
      margin: 0;
    }
    .hero h1 .accent {
      background: linear-gradient(90deg, #ff7cb4, #ffb37c 34%, #79b5ff 70%, #8fdabf);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p { margin: 6px 0 0; color: var(--sub); font-size: 14px; }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    /* 北京时间（固定 Asia/Shanghai，不随本机时区变化） */
    .hero-clock {
      display: flex;
      align-items: baseline;
      gap: 10px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 16px;
    }
    .hc-label { font-size: 11.5px; font-weight: 800; color: var(--sub); letter-spacing: .3px; }
    .hc-time {
      font-size: 23px;
      font-weight: 900;
      color: #2d3f69;
      font-variant-numeric: tabular-nums;
      letter-spacing: .5px;
      line-height: 1;
    }
    .hc-date { font-size: 12px; font-weight: 700; color: var(--sub); }

    /* ---------- ETH 中央舞台 ---------- */
    .eth-stage { margin-bottom: 26px; }
    .stage-note {
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--sub);
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .stage-note b { color: #2d3f69; }
    .stage-note .hot {
      color: #8a5a00;
      background: linear-gradient(90deg, #ffe9b8, #ffd98a);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 800;
    }

    /* 三条长条：整行铺开，把时间轴拉到最宽 */
    .eth-rows { display: flex; flex-direction: column; gap: 14px; }
    .eth-row {
      position: relative;
      border-radius: 22px;
      padding: 18px 24px 16px 30px;
      border: 1px solid #dfe9ff;
      box-shadow: 0 12px 28px rgba(128,153,212,0.16);
      transition: transform .2s ease, box-shadow .2s ease;
      overflow: hidden;
      background: #fff;
    }
    .eth-row:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(128,153,212,0.22); }
    .eth-row::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 6px;
    }
    .eth-row.sep { background: linear-gradient(120deg, #eaf3ff, #f8fbff 58%); }
    .eth-row.sep::before { background: linear-gradient(180deg, var(--sep-a), var(--sep-b)); }
    .eth-row.hoodi { background: linear-gradient(120deg, #e9faf6, #f6fffd 58%); }
    .eth-row.hoodi::before { background: linear-gradient(180deg, var(--hoodi-a), var(--hoodi-b)); }
    .eth-row.primary {
      border: 1.5px solid #ffc46b;
      box-shadow: 0 14px 32px rgba(255,180,100,0.26), inset 0 0 0 1px rgba(255,208,138,.35);
    }
    .eth-row.primary:hover { box-shadow: 0 18px 38px rgba(255,180,100,0.34); }

    .er-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .er-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .er-names { min-width: 0; }
    .er-span { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .er-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .er-tags .lts-tag { margin-top: 0; }
    .er-tags .eth-endnote { margin-top: 0; margin-left: 0; }

    .er-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .er-status { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .er-status .st {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      font-weight: 800;
      color: #2d3f69;
    }
    .er-links { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .er-links .eth-detail { margin-top: 0; width: auto; padding: 7px 14px; }

    .eth-badge {
      position: absolute;
      top: 18px; right: 18px;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    /* 长条里徽章改为跟随标题的行内样式 */
    .eth-row .eth-badge {
      position: static;
      margin-left: 8px;
      vertical-align: middle;
      font-size: 10.5px;
      padding: 3px 10px;
    }
    .badge-primary {
      color: #8a5a00;
      background: linear-gradient(90deg, #ffe6ab, #ffd073);
      box-shadow: 0 4px 12px rgba(255,180,80,.38);
    }
    .badge-next { color: #0d6e5b; background: #c9f2e7; }
    .badge-off { color: #6d7ca6; background: #e8ecf5; }
    .badge-future { color: #6a4fc9; background: #e6ddff; }

    /* 下一代测试网长条：与其他两条同级，用虚线边框区分「预测」 */
    .eth-row.future {
      background: linear-gradient(120deg, #f4f0ff, #fbf9ff 58%);
      border: 1.5px dashed #c9b6ff;
    }
    .eth-row.future::before { background: linear-gradient(180deg, #b59cff, #8b7cf6); }
    .future .eth-icon { background: linear-gradient(135deg, #b59cff, #8b7cf6); box-shadow: 0 8px 18px rgba(139,124,246,.30); }
    .future .eth-span .years { color: #6a4fc9; }
    .future .lts-tag { color: #6a4fc9; background: rgba(139,124,246,.14); }
    .tl-bar.unknown { background: repeating-linear-gradient(45deg, #f2eeff, #f2eeff 6px, #e7e0fb 6px, #e7e0fb 12px); }
    .tl-open {
      position: absolute;
      top: -6px; bottom: -6px;
      width: 3px;
      border-radius: 2px;
      background: #37c98b;
      transform: translateX(-50%);
      z-index: 3;
    }
    .tl-open::after {
      content: '';
      position: absolute;
      top: -4px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #37c98b;
      animation: openPulse 2s ease-in-out infinite;
    }
    @keyframes openPulse {
      0%,100% { box-shadow: 0 0 0 4px rgba(55,201,139,.20); }
      50%     { box-shadow: 0 0 0 8px rgba(55,201,139,.06); }
    }
    .tl-q {
      position: absolute;
      right: 7px; top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 900;
      color: #8b7cf6;
    }
    .status-plan { background: #b59cff; animation: dotBlinkViolet 1.8s ease-in-out infinite; }
    @keyframes dotBlinkViolet {
      0%,100% { box-shadow: 0 0 0 3px rgba(181,156,255,.22); }
      50%     { box-shadow: 0 0 0 6px rgba(181,156,255,.06); }
    }
    .er-note {
      margin-top: 10px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.7;
      color: #6a5a9a;
      background: rgba(240,236,255,.75);
      border-left: 3px solid #b59cff;
      border-radius: 0 10px 10px 0;
      padding: 8px 12px;
    }
    .er-note b { color: #4a3d80; }

    .eth-icon {
      width: 42px; height: 42px;
      border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff;
      flex: none;
    }
    .sep .eth-icon { background: linear-gradient(135deg, var(--sep-a), var(--sep-b)); box-shadow: 0 8px 18px rgba(91,143,249,.32); }
    .hoodi .eth-icon { background: linear-gradient(135deg, var(--hoodi-a), var(--hoodi-b)); box-shadow: 0 8px 18px rgba(63,179,161,.30); }
    .eth-name { font-size: 20px; font-weight: 900; color: #2d3f69; line-height: 1.15; }
    .eth-tag { font-size: 10.5px; color: var(--sub); font-weight: 600; margin-top: 3px; line-height: 1.45; }

    .eth-span {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0;
    }
    .eth-span .years {
      font-size: 31px;
      font-weight: 900;
      letter-spacing: .5px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .sep .eth-span .years { color: #3f6fd8; }
    .hoodi .eth-span .years { color: #2c8f7d; }
    .eth-span .years .arrow { color: #a9b8dd; margin: 0 8px; font-weight: 700; }
    .eth-span .unit { font-size: 11px; font-weight: 700; color: var(--sub); }
    .lts-tag {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      margin-top: 8px;
    }
    .sep .lts-tag { color: #5b48c9; background: rgba(139,124,246,.14); }
    .hoodi .lts-tag { color: #0d6e5b; background: rgba(63,179,161,.14); }
    .eth-endnote {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      color: #a8563a;
      background: rgba(255,226,200,.6);
      border-radius: 999px;
      padding: 3px 10px;
      margin-top: 8px;
      margin-left: 6px;
    }

    /* ---------- 时间轴（长条里拉满整行宽度） ---------- */
    .tl { margin: 10px 0 2px; padding-top: 28px; }
    .tl-bar {
      position: relative;
      height: 18px;
      border-radius: 999px;
      background: #eef3ff;
    }
    .tl-normal {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 999px 0 0 999px;
    }
    .sep .tl-normal { background: linear-gradient(90deg, #b7d3ff, var(--sep-b)); }
    .hoodi .tl-normal { background: linear-gradient(90deg, #b6ecdf, var(--hoodi-b)); }
    .tl-lts {
      position: absolute;
      top: 0; bottom: 0;
      border-radius: 0 999px 999px 0;
    }
    .sep .tl-lts { background: repeating-linear-gradient(45deg, var(--lts-sep), var(--lts-sep) 6px, #b3a5ff 6px, #b3a5ff 12px); }
    .hoodi .tl-lts { background: repeating-linear-gradient(45deg, #2f9c8b, #2f9c8b 6px, #59c4b0 6px, #59c4b0 12px); }
    .tl-lts-mark {
      position: absolute;
      top: -5px; bottom: -5px;
      width: 0;
      border-left: 2px dashed rgba(139,124,246,.6);
    }
    .hoodi .tl-lts-mark { border-left-color: rgba(63,179,161,.6); }
    .tl-cursor {
      position: absolute;
      top: -6px; bottom: -6px;
      width: 3px;
      border-radius: 2px;
      background: var(--now);
      transform: translateX(-50%);
      z-index: 3;
    }
    .tl-cursor::after {
      content: '';
      position: absolute;
      top: -4px; left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--now);
      animation: cursorPulse 2s ease-in-out infinite;
    }
    @keyframes cursorPulse {
      0%,100% { box-shadow: 0 0 0 4px rgba(232,83,109,.20); }
      50%     { box-shadow: 0 0 0 8px rgba(232,83,109,.06); }
    }
    .tl-now {
      position: absolute;
      top: -30px;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 800;
      color: #fff;
      background: var(--now);
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 4;
    }
    .tl-now::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 6px; height: 6px;
      background: var(--now);
    }
    .tl-scale {
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-top: 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--sub);
    }
    .tl-scale-lts {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 10.5px;
      font-weight: 800;
      color: var(--lts-sep);
    }
    .hoodi .tl-scale-lts { color: #2c8f7d; }

    /* ---------- 状态 / 剩余 ---------- */
    .status-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .status-run { background: #37c98b; animation: dotBlink 1.8s ease-in-out infinite; }
    .status-lts { background: var(--lts-sep); }
    .status-off { background: #a0a8bd; }
    @keyframes dotBlink {
      0%,100% { box-shadow: 0 0 0 3px rgba(55,201,139,.20); }
      50%     { box-shadow: 0 0 0 6px rgba(55,201,139,.05); }
    }
    .eth-remain { font-size: 12px; color: var(--sub); font-weight: 600; }
    .eth-remain b { color: #2d3f69; font-weight: 900; font-variant-numeric: tabular-nums; }

    /* ---------- 快捷入口 ---------- */
    .eth-links a {
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      border: 1px solid #e0eaff;
      color: #5271c4;
      text-decoration: none;
      transition: .15s ease;
    }
    .eth-links a:hover { border-color: #cddcff; transform: translateY(-1px); box-shadow: 0 5px 12px rgba(131,152,206,.18); }
    .eth-detail {
      margin-top: 14px;
      width: 100%;
      font-size: 12.5px;
      font-weight: 800;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px dashed #cddcff;
      background: rgba(255,255,255,.55);
      color: #5271c4;
      cursor: pointer;
      transition: .15s ease;
    }
    .eth-detail:hover { background: #fff; border-style: solid; }

    .handoff {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      background: rgba(255,255,255,.62);
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 11px 16px;
      line-height: 1.7;
    }
    .handoff b { color: #2d3f69; }

    /* ---------- 其他网络 grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 14px;
      font-size: 14px;
      font-weight: 900;
      color: #354977;
      letter-spacing: .3px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .card {
      grid-column: span 4;
      border-radius: 22px;
      padding: 20px;
      border: 1px solid #dfe9ff;
      box-shadow: 0 12px 24px rgba(128,153,212,0.18);
      transition: 0.22s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px rgba(128,153,212,0.26);
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #354977;
    }
    .card .sub {
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 14px;
    }
    .card h2 .cn {
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      margin-left: 6px;
    }

    .card.c1 { background: linear-gradient(145deg, #fff6e0, #fffef5); }
    .card.c2 { background: linear-gradient(145deg, #e8f0ff, #f6faff); }
    .card.c3 { background: linear-gradient(145deg, #edeaff, #f5f0ff, #ebfff0); }
    .card.c4 { background: linear-gradient(145deg, #ffe8eb, #fff6f7); }
    .card.c5 { background: linear-gradient(145deg, #f0e8ff, #f8f5ff); }
    .card.c6 { background: linear-gradient(145deg, #fef7e0, #fffef5); }
    .card.c7 { background: linear-gradient(145deg, #e8e8ec, #f5f5f7); }
    .card.c8 { background: linear-gradient(145deg, #e0f5f0, #effaf7); }
    .card.c9 { background: linear-gradient(145deg, #e8f0fe, #f4f9ff); }
    .card.c10 { background: linear-gradient(145deg, #f0eefb, #f9f7ff); }
    .net-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .net-list .net-item {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #e0eaff;
      background: rgba(255,255,255,0.7);
      color: #5a6b9a;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .net-list .net-item b {
      margin-left: 4px;
      font-size: 11px;
      color: #e8536d;
      background: rgba(232,83,109,0.12);
      padding: 0 6px;
      border-radius: 4px;
    }
    .ex-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(49,64,105,0.08);
      color: #5a6b9a;
      letter-spacing: 0.3px;
    }
    .net-item .ex-tag {
      margin-left: 3px;
      font-size: 9px;
      font-weight: 700;
      background: rgba(49,64,105,0.1);
    }
    .l1-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(121,181,255,.20);
      color: #3f6fd8;
      vertical-align: middle;
      letter-spacing: .2px;
    }
    .l1-tag {
      display: inline-block;
      font-style: normal;
      font-size: 9px;
      font-weight: 800;
      margin-left: 5px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(121,181,255,.18);
      color: #3f6fd8;
    }
    .card-note {
      margin-top: 12px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.65;
      padding: 8px 11px;
      border-radius: 0 10px 10px 0;
      border-left: 3px solid #ffc46b;
      background: rgba(255,242,214,.55);
      color: #7a6034;
    }
    .card-note b { color: #5a4620; }
    .card-note.info {
      border-left-color: #79b5ff;
      background: rgba(228,241,255,.62);
      color: #45628f;
    }
    .card-note.info b { color: #2d4a75; }
    .net-list .net-item:hover {
      transform: translateY(-2px);
      border-color: #cddcff;
      box-shadow: 0 6px 14px rgba(131,152,206,0.2);
    }

    /* ---------- 图例卡 ---------- */
    .card.legend .lg-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: var(--sub);
      font-weight: 600;
      padding: 5px 0;
      line-height: 1.4;
    }
    .lg-swatch { width: 26px; height: 11px; border-radius: 999px; flex: none; }
    .card.life .life-row {
      font-size: 11px;
      color: var(--sub);
      font-weight: 600;
      line-height: 1.7;
      padding: 4px 0;
    }
    .card.life .life-row b { color: #354977; }
    .card.life .life-ref {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed #e2e9fb;
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.6;
      color: #9aa0bd;
    }
    .card.life .life-ref a { color: #5271c4; text-decoration: none; font-weight: 700; }

  'BTC': 'c1', 'Ethereum': 'c2', 'Solana': 'c3',

/* ===================== 工具函数 ===================== */
const DAY = 86400000;
function D(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }
function humanDays(d) {
  if (d <= 0) return '已到期';
  const y = Math.floor(d / 365);
  const m = Math.floor((d % 365) / 30);
  if (y > 0) return '约 ' + y + ' 年 ' + m + ' 个月';
  if (m > 0) return '约 ' + m + ' 个月';
  return d + ' 天';
}
function statusOf(net, now) {
  const s = D(net.start), l = D(net.ltsStart), e = D(net.end);
  if (now < s) return { text: '待上线', dot: 'status-off', cls: 'off' };
  if (now < l) return { text: '正常运行中', dot: 'status-run', cls: 'run' };
  if (now < e) return { text: 'LTS 延长支持中', dot: 'status-lts', cls: 'lts' };
  return { text: '已停止运行', dot: 'status-off', cls: 'off' };
}
/* 推荐逻辑：优先推荐仍在运营期内的测试网；两者都在时，优先未进入 LTS 的那个 */
function primaryIdx(now) {
  const a = ETH_NETS[0], b = ETH_NETS[1];
  const aAlive = now < D(a.end), bAlive = now < D(b.end);
  if (aAlive && !bAlive) return 0;
  if (!aAlive && bAlive) return 1;
  if (!aAlive && !bAlive) return -1;
  const aLts = now >= D(a.ltsStart), bLts = now >= D(b.ltsStart);
  if (!aLts && bLts) return 0;
  if (aLts && !bLts) return 1;
  return 0;
}

/* ===================== 渲染 ETH 中央舞台 ===================== */
function renderEthStage(now) {
  const primary = primaryIdx(now);
  const cards = document.getElementById('ethRows');

  const rows = ETH_NETS.map(function (n, i) {
    const s = D(n.start), l = D(n.ltsStart), e = D(n.end);
    const total = e - s;
    const pct = clamp((now - s) / total * 100, 0, 100);
    const ltsPct = clamp((l - s) / total * 100, 0, 100);
    const isPrimary = i === primary;
    const st = statusOf(n, now);
    const daysLeft = Math.ceil((e - now) / DAY);
    const startY = s.getFullYear(), ltsY = l.getFullYear(), endY = e.getFullYear();
    const endScale = n.endNote
      ? endY + '-' + String(e.getMonth() + 1).padStart(2, '0') + ' · 关闭'
      : endY + ' · 停运';

    let badge;
    if (isPrimary) {
      badge = '<span class="eth-badge badge-primary">★ 当前主力测试网</span>';
    } else if (now < e) {
      badge = '<span class="eth-badge badge-next">◆ 继任者 · 未来主力</span>';
    } else {
      badge = '<span class="eth-badge badge-off">已停运</span>';

    const remain = daysLeft > 0
      ? '距 LTS 支持结束还有 <b>' + daysLeft + '</b> 天（' + humanDays(daysLeft) + '）'

    const links = n.links.map(function (lk) {
      return '<a href="' + lk[1] + '" target="_blank" rel="noopener">' + lk[0] + '</a>';
    }).join('');

    const tagLeft = clamp(pct, 6, 94);

    return ''
      + '<div class="eth-row ' + n.cls + (isPrimary ? ' primary' : '') + '">'
      +   '<div class="er-top">'
      +     '<div class="er-id">'
      +       '<div class="eth-icon">' + n.icon + '</div>'

      +         '<div class="eth-tag">' + n.tag + '</div>'
      +       '</div>'
      +     '</div>'
      +     '<div class="er-span">'
      +       '<div class="eth-span">'
      +         '<span class="years">' + startY + '<span class="arrow">—</span>' + endY + '</span>'
      +         '<span class="unit">运行区间</span>'
      +       '</div>'
      +       '<div class="er-tags">'
      +         '<span class="lts-tag">第 ' + ltsY + ' 年 · LTS 延长支持年</span>'
      +         (n.endNote ? '<span class="eth-endnote">🕘 ' + n.endNote + '</span>' : '')
      +       '</div>'
      +     '</div>'
      +   '</div>'
      +   '<div class="tl">'
      +     '<div class="tl-bar">'
      +       '<div class="tl-normal" style="width:' + ltsPct + '%"></div>'
      +       '<div class="tl-lts" style="left:' + ltsPct + '%;width:' + (100 - ltsPct) + '%"></div>'
      +       '<div class="tl-lts-mark" style="left:' + ltsPct + '%"></div>'
      +       '<div class="tl-cursor" id="cur-' + i + '" style="left:' + pct + '%"></div>'
      +       '<div class="tl-now" id="now-' + i + '" style="left:' + tagLeft + '%">现在</div>'
      +     '</div>'
      +     '<div class="tl-scale">'
      +       '<span>' + startY + ' · 上线</span>'
      +       '<span class="tl-scale-lts" style="left:' + ltsPct + '%">LTS ' + ltsY + '</span>'
      +       '<span>' + endScale + '</span>'
      +     '</div>'
      +   '</div>'
      +   '<div class="er-bottom">'
      +     '<div class="er-status">'
      +       '<span class="st" id="st-' + i + '"><span class="status-dot ' + st.dot + '"></span>' + st.text + '</span>'
      +       '<span class="eth-remain" id="rm-' + i + '">' + remain + '</span>'
      +     '</div>'
      +     '<div class="er-links">'
      +       links
      +       '<button class="eth-detail" onclick="openModal(\'Ethereum\', \'' + n.name + '\')">查看完整详情 →</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
  });
  // 顺序：Sepolia → 下一代测试网（预测） → Hoodi
  cards.innerHTML = rows[0] + futureRowHtml() + rows[1];

  // 顶部推荐提示（随当前时间与推荐对象变化）
  const note = document.getElementById('stageNote');
  const sepAlive = now < D(ETH_NETS[0].end);
  if (primary === 0) {
    note.innerHTML = '当前主力测试网：<span class="hot">' + ETH_NETS[0].name + '</span> &nbsp;·&nbsp; '
      + ETH_NETS[1].name + ' 为下一代测试网，' + D(ETH_NETS[0].ltsStart).getFullYear() + ' 年 '
      + ETH_NETS[0].name + ' 进入 LTS 后正式接棒';
  } else if (primary === 1) {
    note.innerHTML = (sepAlive
      ? ETH_NETS[0].name + ' 已进入 LTS 延长支持期'
      : ETH_NETS[0].name + ' 已停止运行')
      + ' &nbsp;·&nbsp; 当前主力测试网：<span class="hot">' + ETH_NETS[1].name + '</span>';
  } else {
    note.innerHTML = '两个以太坊测试网均已停止运行';
  }

  // 底部交棒说明（随状态变化）
  const a = ETH_NETS[0], b = ETH_NETS[1];
  const aAlive = now < D(a.end), bAlive = now < D(b.end);
  let tip;
  const aLts = now >= D(a.ltsStart);
  if (aAlive && bAlive && !aLts) {
    tip = a.name + ' 的第 ' + D(a.ltsStart).getFullYear() + ' 年、' + b.name + ' 的第 ' + D(b.ltsStart).getFullYear()
      + ' 年为 LTS 延长支持年；建议现在就开始在 ' + b.name + ' 上做迁移测试。';
  } else if (aAlive && bAlive) {
    tip = a.name + ' 已进入 LTS 延长支持期，预计 ' + a.end + ' 关闭；下一代测试网预计 '
      + FUTURE_NET.openLabel + ' 开启（预测），请尽快完成迁移。';
  } else if (!aAlive && bAlive) {
    tip = a.name + ' 已停运，' + b.name + ' 为当前主力；下一代测试网预计 ' + FUTURE_NET.openLabel + ' 开启（预测）。';
  } else {
    tip = '两个测试网均已停运，请以以太坊基金会官方公告为准。';
  }
  document.getElementById('handoff').innerHTML =
    '🔄 继任路线：<b>' + a.name + '（' + D(a.start).getFullYear() + ' — ' + D(a.end).getFullYear() + '）</b>'
    + ' &nbsp;→&nbsp; '
    + '<b>' + b.name + '（' + D(b.start).getFullYear() + ' — ' + D(b.end).getFullYear() + '）</b>'
    + '<br>' + tip;
}

/* ===================== 动态更新（游标 / 状态 / 剩余天数） ===================== */
function updateEthTiming(now) {
  ETH_NETS.forEach(function (n, i) {
    const s = D(n.start), l = D(n.ltsStart), e = D(n.end);
    const total = e - s;
    const pct = clamp((now - s) / total * 100, 0, 100);
    const cursor = document.getElementById('cur-' + i);
    const nowTag = document.getElementById('now-' + i);
    if (cursor) cursor.style.left = pct + '%';
    if (nowTag) nowTag.style.left = clamp(pct, 6, 94) + '%';

    const st = statusOf(n, now);
    const stEl = document.getElementById('st-' + i);
    if (stEl) stEl.innerHTML = '<span class="status-dot ' + st.dot + '"></span>' + st.text;

    const rmEl = document.getElementById('rm-' + i);
    if (rmEl) {
      const daysLeft = Math.ceil((e - now) / DAY);
      rmEl.innerHTML = daysLeft > 0
        ? '距 LTS 支持结束还有 <b>' + daysLeft + '</b> 天（' + humanDays(daysLeft) + '）'
        : 'LTS 支持已结束';
    }
  });
}

/* ===================== 详情 Modal ===================== */
function openModal(category, name, el) {
  for (const g of NETWORKS) {
    if (g.category !== category) continue;
    for (const n of g.items) {
      if (n.name !== name) continue;
      const exLabel = n.exchange ? ' <span class="ex-tag" style="font-size:11px">' + n.exchange + '</span>' : '';
      document.getElementById('modalTitle').innerHTML = g.icon + ' ' + category + ' <span class="cn">' + g.cn + '</span> — ' + name + exLabel + ' <span class="max-badge">' + n.max + '</span>';
      let html = '';
      n.data.forEach(function (row) {
        html += '<div class="row"><span class="label">' + row[0] + '</span><span>' + row[1] + '</span></div>';
      });
      if (n.l1) {
        html += '<div class="row"><span class="label">L1</span><span>Ethereum ' + n.l1 + '（' + n.l1 + ' 关闭后本网将同步停止）</span></div>';
      }
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
      return;
    }
  }
}

function openFutureModal() {
  document.getElementById('modalTitle').innerHTML =
    '⚡ Ethereum <span class="cn">以太坊</span> — 下一代测试网 <span class="max-badge">预测</span>';
  document.getElementById('modalBody').innerHTML = ''
    + '<div class="row"><span class="label">状态</span><span>未上线 · 时间预测</span></div>'
    + '<div class="row"><span class="label">预测开启</span><span><b>' + FUTURE_NET.openLabel + '</b></span></div>'
    + '<div class="row"><span class="label">预测依据</span><span>' + FUTURE_NET.reason + '</span></div>'
    + '<div class="row"><span class="label">迁移窗口</span><span>' + FUTURE_NET.gap
    + '（Sepolia 预计 ' + FUTURE_NET.closeLabel + ' 关闭，新网开启后有并行期）</span></div>'
    + '<div class="row"><span class="label">参考</span><span>'
    + '<a href="https://ethereum.org/en/developers/docs/networks/" target="_blank">ethereum.org/networks</a></span></div>'
    + '<div class="row"><span class="label">注意</span><span>' + FUTURE_NET.disclaimer + '</span></div>';
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e) {
    if (e.target !== document.getElementById('modalOverlay')) {
      if (!e.target.closest('.modal-close')) return;
    }
  }
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeModal();
});

/* ===================== 启动 ===================== */
renderEthStage(new Date());
tick();
setInterval(tick, 1000);
</script>
