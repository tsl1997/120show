<div id="app">
  <header id="topbar">
    <div class="top-title">🧳 旅行图鉴之路</div>

    </div>
  </header>

  <nav id="tabs">
    <button class="tab active" data-tab="city">🏙 本城</button>
    <button class="tab" data-tab="map">🗺 世界地图</button>
    <button class="tab" data-tab="book">📖 图鉴</button>
    <button class="tab" data-tab="bag">🎒 背包</button>
    <button class="tab" data-tab="office">🛂 事务所</button>
  </nav>

  <main id="view"></main>

  <footer id="footbar">本游戏价格参考现实物价 · 收益仅为游戏数值 · 图鉴点亮即获旅行基金</footer>
</div>

<div id="modal-wrap" class="hidden"></div>
