  <style>
    :root {
      --bg1: #fff8ff;
      --bg2: #eef8ff;
      --bg3: #fffef3;
      --text: #314069;
      --sub: #6d7ca6;
      --line: #dbe6ff;
      --pink: #ff7cb4;
      --peach: #ffb37c;
      --blue: #79b5ff;
      --mint: #71d9c4;
      --lavender: #b59cff;
      --card-bg: rgba(255,255,255,0.86);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at 12% 14%, rgba(255,179,124,0.28) 0, transparent 28%),
        radial-gradient(circle at 86% 9%, rgba(181,156,255,0.26) 0, transparent 30%),
        radial-gradient(circle at 76% 82%, rgba(121,181,255,0.22) 0, transparent 33%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 52%, var(--bg3));
      min-height: 100vh;
    }
    .wrap {
      max-width: 1160px;
      margin: 0 auto;
      padding: 22px 18px 70px;
    }
    .hero {
      background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(248,252,255,0.86));
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 16px 40px rgba(131,152,206,0.2);
      padding: 24px;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: 28px;
      font-weight: 900;
      color: #2d3f69;
      margin: 0;
    }
    .hero h1 .accent {
      background: linear-gradient(90deg, #ff7cb4, #ffb37c 34%, #79b5ff 70%, #8fdabf);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p { margin: 6px 0 0; color: var(--sub); font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
    }

    .card {
      grid-column: span 4;
      border-radius: 22px;
      padding: 20px;
      border: 1px solid #dfe9ff;
      box-shadow: 0 12px 24px rgba(128,153,212,0.18);
      transition: 0.22s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px rgba(128,153,212,0.26);
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #354977;
    }
    .card .sub {
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 14px;
    }

    .card.c1 { background: linear-gradient(145deg, #fff6e0, #fffef5); }
    .card.c2 { background: linear-gradient(145deg, #e8f0ff, #f6faff); }
    .card.c3 { background: linear-gradient(145deg, #edeaff, #f5f0ff, #ebfff0); }
    .card.c4 { background: linear-gradient(145deg, #ffe8eb, #fff6f7); }
    .card.c5 { background: linear-gradient(145deg, #f0e8ff, #f8f5ff); }
    .card.c6 { background: linear-gradient(145deg, #fef7e0, #fffef5); }
    .card.c7 { background: linear-gradient(145deg, #e8e8ec, #f5f5f7); }
    .card.c8 { background: linear-gradient(145deg, #e0f5f0, #effaf7); }
    .card.c9 { background: linear-gradient(145deg, #e8f0fe, #f4f9ff); }
    .card.c10 { background: linear-gradient(145deg, #f0eefb, #f9f7ff); }
    .net-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .net-list .net-item {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #e0eaff;
      background: rgba(255,255,255,0.7);
      color: #5a6b9a;
      cursor: pointer;
      transition: 0.15s ease;
    }
    .net-list .net-item b {
      margin-left: 4px;
      font-size: 11px;
      color: #e8536d;
      background: rgba(232,83,109,0.12);
      padding: 0 6px;
      border-radius: 4px;
    }
    .ex-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(49,64,105,0.08);
      color: #5a6b9a;
      letter-spacing: 0.3px;
    }
    .net-item .ex-tag {
      margin-left: 3px;
      font-size: 9px;
      font-weight: 700;
      background: rgba(49,64,105,0.1);
    }
    .net-list .net-item:hover {
      transform: translateY(-2px);
      border-color: #cddcff;
      box-shadow: 0 6px 14px rgba(131,152,206,0.2);
    }

    @media (max-width: 900px) {
      .card { grid-column: span 12; }
    }

    /* ---- Modal ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20,28,52,0.55);
      backdrop-filter: blur(6px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #fff;
      border-radius: 26px;
      max-width: 460px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 28px 18px;
      box-shadow: 0 24px 64px rgba(30,50,100,0.3);
      animation: modalIn .25s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.92) translateY(14px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-head h3 {
      font-size: 20px;
      color: #2d3f69;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .max-badge {
      font-size: 13px;
      font-weight: 800;
      color: #e8536d;
      background: rgba(232,83,109,0.1);
      padding: 2px 10px;
      border-radius: 999px;
    }
    .modal-head .icon {
      font-size: 22px;
    }
    .modal-close {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid #e0eaff;
      background: #fff;
      color: #7c8bb5;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }
    .modal-close:hover { background: #f5f7ff; border-color: #cddcff; }

    .modal-body .row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 8px 0;
      font-size: 13px;
      border-bottom: 1px solid #f0f4ff;
    }
    .modal-body .row:last-child { border-bottom: none; }
    .modal-body .row .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
      background: #f0f4ff;
      color: #6a78a4;
      min-width: 32px;
      text-align: center;
    }
    .modal-body .row a {
      color: #5271c4;
      text-decoration: none;
      font-weight: 600;
    }
    .modal-body .row a:hover { text-decoration: underline; }
    .modal-body .row .label {
      min-width: 44px;
      color: var(--sub);
      font-weight: 600;
    }

    .modal::-webkit-scrollbar { width: 5px; }
    .modal::-webkit-scrollbar-track { background: transparent; }
    .modal::-webkit-scrollbar-thumb { background: #d0dcf0; border-radius: 4px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--sub);
      text-decoration: none;
      transition: 0.15s;
    }
    .back-link:hover { color: var(--text); }

const COLOR_MAP = {
  'BTC': 'c1', 'Ethereum': 'c2', 'Solana': 'c3',
  'TRON': 'c4', 'Polygon': 'c5', 'ARC': 'c9',
  'CEX Testnets': 'c6', 'Hoodi L2s': 'c7', 'Sepolia L2s': 'c8'
};
const app = document.getElementById('app');
NETWORKS.forEach(g => {
  const card = document.createElement('div');
  card.className = 'card ' + (COLOR_MAP[g.category] || 'c1');
  let netHtml = '';
  g.items.forEach(n => {
    const ex = n.exchange ? `<i class="ex-tag">${n.exchange}</i>` : '';
    netHtml += `<span class="net-item" onclick="event.stopPropagation();openModal('${g.category}', '${n.name}', this)">${n.name} <b>${n.max}</b>${ex}</span>`;
  });
  card.innerHTML = `<h2>${g.icon} ${g.category}</h2><div class="sub">${g.items.length} 个测试网络</div><div class="net-list">${netHtml}</div>`;
  app.appendChild(card);
});

function openModal(category, name, el) {
  // find data
  for (const g of NETWORKS) {
    if (g.category !== category) continue;
    for (const n of g.items) {
      if (n.name !== name) continue;
      const exLabel = n.exchange ? ` <span class="ex-tag" style="font-size:11px">${n.exchange}</span>` : '';
      document.getElementById('modalTitle').innerHTML = `${g.icon} ${category} — ${name}${exLabel} <span class="max-badge">${n.max}</span>`;
      let html = '';
      n.data.forEach(row => {
        html += `<div class="row"><span class="label">${row[0]}</span><span>${row[1]}</span></div>`;
      });
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
      return;
    }
  }
}

function closeModal(e) {
  if (e) {
    if (e.target !== document.getElementById('modalOverlay')) {
      if (!e.target.closest('.modal-close')) return;
    }
  }
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>
