<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Lib 共享入口 | XS 魔法实验室</title>
    <style>
        :root {
            --bg1: #fff8ff;
            --bg2: #eef8ff;
            --bg3: #fffef3;
            --text-main: #33456f;
            --text-muted: #6f7ea8;
            --line: #dce7ff;
            --pink: #ff7cb4;
            --peach: #ffb37c;
            --blue: #79b5ff;
            --mint: #71d9c4;
            --card-shadow: 0 12px 30px rgba(124, 154, 219, 0.16);
            --card-shadow-hover: 0 18px 36px rgba(124, 154, 219, 0.24);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 12% 14%, rgba(255, 179, 124, 0.28) 0, transparent 28%),
                radial-gradient(circle at 86% 9%, rgba(181, 156, 255, 0.26) 0, transparent 30%),
                radial-gradient(circle at 76% 82%, rgba(121, 181, 255, 0.22) 0, transparent 33%),
                linear-gradient(160deg, var(--bg1), var(--bg2) 52%, var(--bg3));
            min-height: 100vh;
            color: var(--text-main);
            padding: 28px 16px 56px;
        }

        .sparkles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.45;
            background-image:
                radial-gradient(circle, rgba(255, 124, 180, 0.58) 1px, transparent 1px),
                radial-gradient(circle, rgba(121, 181, 255, 0.58) 1px, transparent 1px);
            background-size: 44px 44px, 60px 60px;
            background-position: 0 0, 18px 22px;
        }

        .wrap { max-width: 900px; margin: 0 auto; position: relative; z-index: 2; }

        .hero {
            background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(248,252,255,0.88));
            border: 1px solid var(--line);
            border-radius: 22px;
            box-shadow: var(--card-shadow);
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .pill {
            font-size: 12px;
            font-weight: 700;
            color: #8d5d9d;
            background: linear-gradient(90deg, #ffe3f2, #eaf3ff);
            border: 1px solid #efdbff;
            border-radius: 999px;
            padding: 6px 12px;
        }

        .home-link {
            text-decoration: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 8px 12px;
            transition: 0.2s ease;
        }

        .home-link:hover {
            transform: translateY(-2px);
            border-color: #cddcff;
            box-shadow: 0 6px 14px rgba(131, 152, 206, 0.2);
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            width: 100%;
            padding: 28px 20px;
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        h1 {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 900;
            margin-bottom: 22px;
            background: linear-gradient(90deg, var(--pink), var(--peach) 34%, var(--blue) 70%, var(--mint));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .field-group { text-align: left; margin-bottom: 16px; }
        .label { font-size: 12px; font-weight: 800; color: #7587b5; margin-bottom: 8px; display: block; }

        .display-box {
            background: #fff;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid #dbe8ff;
            transition: 0.2s;
        }

        .display-box:hover { border-color: #b9ceff; box-shadow: 0 8px 16px rgba(131, 152, 206, 0.16); }

        .value-text {
            font-size: 18px;
            font-weight: 800;
            word-break: break-all;
            color: #3d5080;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        .btn { border: none; cursor: pointer; transition: all 0.2s; font-family: inherit; }

        .copy-btn {
            color: #fff;
            background: linear-gradient(90deg, var(--pink), var(--peach), var(--blue));
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .copy-btn:hover { transform: translateY(-1px); }

        .main-btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

        .next-btn,
        .history-btn {
            flex: 1;
            min-width: 140px;
            padding: 13px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
        }

        .next-btn {
            color: #fff;
            background: linear-gradient(90deg, var(--pink), var(--peach), var(--blue));
            box-shadow: 0 10px 18px rgba(134, 164, 227, 0.35);
        }

        .next-btn:hover { transform: translateY(-2px); }

        .history-btn {
            background: #fff;
            color: #5d6f9f;
            border: 1px solid #dbe8ff;
        }

        .history-btn:hover { background: #f7faff; border-color: #c4d8ff; }

        .usage-tip { font-size: 12px; color: var(--text-muted); margin-top: 16px; line-height: 1.6; }
        .visit-link { display: inline-block; margin-top: 12px; color: #5d6f9f; text-decoration: none; font-size: 13px; font-weight: 700; }

        .footer { margin-top: 18px; font-size: 12px; color: #7b8ab4; text-align: center; }
        .footer a { color: #5d6f9f; text-decoration: none; font-weight: 700; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(102, 124, 182, 0.22);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: rgba(255,255,255,0.96);
            border: 1px solid #dbe8ff;
            width: 95%;
            max-width: 620px;
            border-radius: 22px;
            padding: 18px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--card-shadow-hover);
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #edf3ff; padding-bottom: 10px; }
        .close-modal { font-size: 24px; cursor: pointer; color: #8ea0cb; padding: 0 8px; }

        .history-list { overflow-y: auto; flex: 1; border-radius: 10px; }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid #edf3ff;
            font-size: 13px;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            align-items: center;
            gap: 10px;
        }

        .history-item:nth-child(even) { background-color: #fbfdff; }
        .history-item:last-child { border-bottom: none; }
        .time-tag { color: #9badd5; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

        .pagination { display: flex; justify-content: center; gap: 14px; margin-top: 12px; align-items: center; padding-top: 10px; border-top: 1px solid #edf3ff; }
        .page-btn { padding: 8px 12px; background: #f8fbff; border: 1px solid #dbe8ff; border-radius: 10px; font-size: 12px; font-weight: 700; color: #5d6f9f; }
        .page-btn:disabled { color: #bac9ea; cursor: not-allowed; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, var(--pink), var(--peach), var(--blue));
            color: white;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 200;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="sparkles" aria-hidden="true"></div>

    <div class="wrap">
    <header class="hero">
        <span class="pill">内容工具 / Z-Lib 共享入口</span>
        <a class="home-link" href="../index.html" target="_blank" rel="noopener noreferrer">返回主页</a>
    </header>

    <div class="card">
        <h1>Z-Library 共享中心</h1>

        <div class="field-group">
            <span class="label">账号 (EMAIL)</span>
            <div class="display-box">
                <span id="email-val" class="value-text">准备就绪</span>
                <button class="copy-btn btn" onclick="copyText('email-val')">复制</button>
            </div>
        </div>

        <div class="field-group">
            <span class="label">密码 (PASSWORD)</span>
            <div class="display-box">
                <span id="pwd-val" class="value-text">******</span>
                <button class="copy-btn btn" onclick="copyText('pwd-val')">复制</button>
            </div>
        </div>

        <div class="main-btns">
            <button class="next-btn btn" onclick="handleNext()">换一个账号</button>
            <button class="history-btn btn" onclick="openHistory()">查看历史</button>
        </div>
        
        <div class="usage-tip">
            温馨提示：每个账号每日可下载10本数据。<br>
            如果额度用完，请点击上方“换一个”按钮尝试其他账号。
        </div>

        <a href="https://zh.z-library.sk/" target="_blank" rel="noopener noreferrer" class="visit-link">前往 Z-Library 官方网站 →</a>
    </div>

    <!-- 页脚署名 -->
    <div class="footer">
        本作品由 <a href="https://x.com/btc_xs" target="_blank" rel="noopener noreferrer">XS</a> 制作
    </div>
    </div>

    <!-- 历史记录弹窗 -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeHistory(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="font-size: 20px;">今日获取历史</h3>
                <span class="close-modal" onclick="closeHistory()">&times;</span>
            </div>
            <div id="historyList" class="history-list">
                <!-- 动态生成 -->
            </div>
            <div id="pagination" class="pagination">
                <!-- 分页 -->
            </div>
        </div>
    </div>

    <div id="toast" class="toast">复制成功</div>

    <script>
        // 数据源
        const ACCOUNTS_DATA = `sviprr@163.com===wedad231ass
b_love@126.com===edasdas122dsd
banruoqing@163.com===pkdsa754ssdfsdf
raoruoqing@163.com===bfbsdfs94523szd
mayun_taobao@163.com===feefsfsf6433fd
begggg@163.com===andcwqe2177yfv
xuanruoqing@163.com===jswd13cxf24ew
kongruoqing@163.com===m2sdssd213
kuangruoqing@163.com===y2mdsnq3ld
renruoqing@163.com===88dsasdsad33
x_love@163.com===xxx888abc
puruoqing@163.com===wewd123243
r_love@126.com===tggs13434dxzd
taoruoqing@163.com===554dsdsdq3
jianruoqing@163.com===55ffgsfds22
kuiruoqing@163.com===123dfdfwr3
boss6b@163.com===535dfsfs232
chengruoqing@163.com===crq123crq666
tutulove@126.com===tt520love
didilove@126.com===dd520love
zhengruoqing@163.com===zrq666vip
b_kiss@163.com===bkissb520
beiruoqing@163.com===brq520brq
love_i@126.com===loveloveme
vip_pp@163.com===vipppvippp
nieruoqing@163.com===nrz520nrq
wengruoqing@163.com===weng520
bchhhh@163.com===bch666bch888
g_love@163.com===gglove520
eosaaa@163.com===eoseos444
love_r@163.com===loverrr520
houruoqing@163.com===hong888
becccc@163.com===ccc888666
turuoqing@163.com===tu520tu
quruoqing@163.com===ququ520
peiruoqing@163.com===peipei520
zhuangruoqing@163.com===zhuang520
ganruoqing@163.com===gangan666
furuoqing@163.com===fufu888
idaodu@163.com===daodu888
ai@btcjjj.com===ai666666`.split('\n').filter(line => line.includes('===')).map(line => {
            const [email, pwd] = line.split('===');
            return { email: email.trim(), pwd: pwd.trim() };
        });

        const DB_KEY = 'zlib_pro_state';
        let currentPage = 1;
        const itemsPerPage = 5;

        function getAppState() {
            const today = new Date().toDateString();
            let state = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
            if (!state || state.date !== today) {
                state = { date: today, history: [] };
                localStorage.setItem(DB_KEY, JSON.stringify(state));
            }
            return state;
        }

        function saveState(state) {
            localStorage.setItem(DB_KEY, JSON.stringify(state));
        }

        function handleNext() {
            const state = getAppState();
            const usedIndexes = state.history.map(h => h.idx);
            const available = ACCOUNTS_DATA.map((_, i) => i).filter(i => !usedIndexes.includes(i));

            if (available.length === 0) {
                alert("今日所有账号额度已试完，请明日再来！");
                return;
            }

            const nextIdx = available[Math.floor(Math.random() * available.length)];
            const record = {
                idx: nextIdx,
                time: new Date().toLocaleTimeString('zh-CN', { hour12: false })
            };

            state.history.push(record);
            saveState(state);
            renderAccount(nextIdx);
        }

        function renderAccount(index) {
            document.getElementById('email-val').innerText = ACCOUNTS_DATA[index].email;
            document.getElementById('pwd-val').innerText = ACCOUNTS_DATA[index].pwd;
        }

        function openHistory() {
            currentPage = 1;
            renderHistoryList();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeHistory() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function renderHistoryList() {
            const state = getAppState();
            const history = [...state.history].reverse();
            const listEl = document.getElementById('historyList');
            const pagEl = document.getElementById('pagination');
            
            listEl.innerHTML = '';
            pagEl.innerHTML = '';

            if (history.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#86868b; padding:40px;">尚未获取任何账号</div>';
                return;
            }

            const total = history.length;
            const usePag = total > itemsPerPage;
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = history.slice(start, start + itemsPerPage);

            pageData.forEach(item => {
                const acc = ACCOUNTS_DATA[item.idx];
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div style="font-weight:700; color:#000;">${acc.email}</div>
                    <div style="font-family:monospace; color:#444;">${acc.pwd}</div>
                    <div class="time-tag">${item.time}</div>
                `;
                listEl.appendChild(div);
            });

            if (usePag) {
                const totalPages = Math.ceil(total / itemsPerPage);
                pagEl.innerHTML = `
                    <button class="page-btn btn" ${currentPage === 1 ? 'disabled' : ''} onclick="flipPage(-1)">上一页</button>
                    <span style="font-size:12px; font-weight:600;">${currentPage} / ${totalPages}</span>
                    <button class="page-btn btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="flipPage(1)">下一页</button>
                `;
            }
        }

        function flipPage(step) {
            currentPage += step;
            renderHistoryList();
        }

        function copyText(id) {
            const val = document.getElementById(id).innerText;
            if (val.includes('准备') || val.includes('***')) return;
            
            const tmp = document.createElement('textarea');
            tmp.value = val;
            document.body.appendChild(tmp);
            tmp.select();
            document.execCommand('copy');
            document.body.removeChild(tmp);

            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 1500);
        }

        window.onload = () => {
            const state = getAppState();
            if (state.history.length > 0) {
                renderAccount(state.history[state.history.length - 1].idx);
            } else {
                handleNext();
            }
        };
    </script>
</body>
</html>
