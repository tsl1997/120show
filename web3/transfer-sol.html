<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOL 测试网转账</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bs58@5/dist/bs58.min.js"></script>
    <style>
        :root {
            --pink: #ff7cb4;
            --peach: #ffb37c;
            --blue: #79b5ff;
            --text-main: #33456f;
            --line: #dce7ff;
        }
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(160deg, #fff8ff, #eef8ff 52%, #fffef3);
            color: var(--text-main);
            min-height: 100vh;
        }
        .card {
            background: rgba(255,255,255,0.92);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(124,154,219,0.16);
        }
        .btn-primary {
            background: linear-gradient(90deg, var(--pink), var(--peach), var(--blue));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            transition: opacity 0.2s;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.85; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-outline {
            border: 1px solid var(--line);
            border-radius: 10px;
            font-weight: 700;
            color: var(--text-main);
            background: #fff;
            transition: all 0.15s;
        }
        .btn-outline:hover { background: #f0f4ff; border-color: var(--blue); }
        input, select {
            border: 1px solid var(--line);
            border-radius: 12px;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(121,181,255,0.15); }
        .addr-text {
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">
    <div class="card w-full max-w-lg p-8">
        <h1 class="text-3xl font-black mb-1">◎ SOL 测试网转账</h1>
        <p class="text-sm text-gray-500 mb-8">支持 Devnet / Testnet，无需插件</p>

        <!-- Private Key -->
        <div class="flex gap-2 mb-5">
            <div class="flex-1">
                <label class="text-xs font-bold text-gray-600 mb-1.5 block">私钥 (JSON 数组 或 Base58)</label>
                <input id="keyInput" type="password" class="w-full p-4 font-mono text-sm" placeholder="[...] 或 Phantom 导出的 base58 私钥">
            </div>
            <div class="flex-shrink-0 self-end">
                <button id="newBtn" class="btn-outline px-4 py-4 text-xs font-black whitespace-nowrap">✨ 新建</button>
            </div>
        </div>

        <!-- Address -->
        <div class="mb-5 p-4 bg-gray-50 rounded-xl flex items-center justify-between gap-2">
            <span class="text-xs font-bold text-gray-500">地址</span>
            <span id="addressDisplay" class="addr-text text-xs font-bold text-gray-700 flex-1 text-right">—</span>
            <button id="copyBtn" class="text-xs text-blue-500 hover:text-blue-700 font-bold cursor-pointer" title="复制地址">📋</button>
        </div>

        <!-- Network & Balance -->
        <div class="flex gap-3 mb-5">
            <div class="flex-1">
                <label class="text-xs font-bold text-gray-600 mb-1.5 block">网络</label>
                <select id="netSelect" class="w-full p-4 text-sm font-bold appearance-none bg-white">
                    <option value="devnet">Devnet</option>
                    <option value="testnet">Testnet</option>
                </select>
            </div>
            <div class="flex-1">
                <label class="text-xs font-bold text-gray-600 mb-1.5 block">余额</label>
                <div class="w-full h-[52px] flex items-center px-4 bg-gray-50 rounded-xl text-sm font-bold">
                    <span id="balanceDisplay" class="text-gray-400">—</span>
                    <button id="refreshBtn" class="ml-auto text-xs text-blue-500 hover:text-blue-700 font-bold">⟳</button>
                </div>
            </div>
        </div>

        <!-- To Address -->
        <label class="text-xs font-bold text-gray-600 mb-1.5 block">接收地址</label>
        <input id="toInput" class="w-full p-4 mb-5 font-mono text-sm" placeholder="Gj...">

        <!-- Amount -->
        <label class="text-xs font-bold text-gray-600 mb-1.5 block">转账金额 (SOL)</label>
        <input id="amountInput" type="number" step="0.000000001" min="0" class="w-full p-4 mb-3 text-lg font-bold" placeholder="0.0">
        <div class="flex flex-wrap gap-2 mb-6">
            <button class="quick-btn btn-outline px-4 py-2 text-xs" data-val="1">1</button>
            <button class="quick-btn btn-outline px-4 py-2 text-xs" data-val="0.1">0.1</button>
            <button class="quick-btn btn-outline px-4 py-2 text-xs" data-val="0.01">0.01</button>
            <button class="quick-btn btn-outline px-4 py-2 text-xs" data-val="25%">25%</button>
            <button class="quick-btn btn-outline px-4 py-2 text-xs" data-val="50%">50%</button>
            <button class="quick-btn btn-outline px-4 py-2 text-xs" data-val="100%">100%</button>
        </div>

        <!-- Send -->
        <button id="sendBtn" class="btn-primary w-full py-4 text-sm font-black tracking-wider" disabled>请先导入私钥</button>

        <!-- Result -->
        <div id="resultBox" class="hidden mt-6 p-4 rounded-xl bg-green-50 border border-green-200">
            <div class="flex items-center gap-2 text-green-700 font-bold text-sm mb-2">✅ 发送成功</div>
            <div id="txHashDisplay" class="text-xs font-mono bg-white rounded p-2 break-all"></div>
            <a id="explorerLink" href="#" target="_blank" class="text-blue-600 font-bold text-xs mt-2 inline-block hover:underline hidden">🔗 在浏览器查看</a>
        </div>
        <div id="errorBox" class="hidden mt-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-600 text-sm font-bold"></div>
    </div>

    <script>
        const NETWORKS = {
            devnet:  { name: 'Devnet',  rpc: 'https://api.devnet.solana.com',      explorer: 'https://explorer.solana.com/tx/', cluster: 'devnet' },
            testnet: { name: 'Testnet', rpc: 'https://api.testnet.solana.com',     explorer: 'https://explorer.solana.com/tx/', cluster: 'testnet' }
        };

        const FEE_RESERVE_LAMPORTS = 1000000n; // 0.001 SOL reserved for fees on 100%

        const el = id => document.getElementById(id);
        const keyInput = el('keyInput');
        const newBtn = el('newBtn');
        const addressDisplay = el('addressDisplay');
        const copyBtn = el('copyBtn');
        const netSelect = el('netSelect');
        const balanceDisplay = el('balanceDisplay');
        const refreshBtn = el('refreshBtn');
        const toInput = el('toInput');
        const amountInput = el('amountInput');
        const sendBtn = el('sendBtn');
        const resultBox = el('resultBox');
        const errorBox = el('errorBox');
        const txHashDisplay = el('txHashDisplay');
        const explorerLink = el('explorerLink');

        let connection = null;
        let keypair = null;
        let currentBalanceLamports = 0n;

        const getNet = () => NETWORKS[netSelect.value];

        const initConnection = () => {
            const net = getNet();
            connection = new solanaWeb3.Connection(net.rpc, 'confirmed');
        };
        initConnection();

        const importKeypair = (raw) => {
            let secretKey;
            if (raw.startsWith('[')) {
                const arr = JSON.parse(raw);
                secretKey = new Uint8Array(arr);
            } else {
                secretKey = bs58.decode(raw);
            }
            return solanaWeb3.Keypair.fromSecretKey(secretKey);
        };

        const connectWallet = () => {
            const raw = keyInput.value.trim();
            if (!raw) {
                keypair = null;
                addressDisplay.textContent = '—';
                balanceDisplay.textContent = '—';
                sendBtn.disabled = true; sendBtn.textContent = '请先导入私钥';
                return;
            }
            try {
                keypair = importKeypair(raw);
                const pubkey = keypair.publicKey.toBase58();
                addressDisplay.textContent = pubkey;
                sendBtn.disabled = false; sendBtn.textContent = '发送';
                updateBalance();
                hideResult();
            } catch (e) {
                console.error('连接失败:', e.message || e);
                keypair = null;
                addressDisplay.textContent = '—';
                balanceDisplay.textContent = '—';
                sendBtn.disabled = true; sendBtn.textContent = '私钥格式无效';
            }
        };

        const generateNew = () => {
            const kp = solanaWeb3.Keypair.generate();
            const pkArray = Array.from(kp.secretKey);
            keyInput.value = JSON.stringify(pkArray);
            connectWallet();
        };

        const updateBalance = async () => {
            if (!connection || !keypair) { balanceDisplay.textContent = '—'; return; }
            try {
                const lamports = await connection.getBalance(keypair.publicKey);
                currentBalanceLamports = BigInt(lamports);
                balanceDisplay.textContent = (lamports / solanaWeb3.LAMPORTS_PER_SOL) + ' SOL';
            } catch (e) {
                console.warn('余额查询失败:', e.message);
                balanceDisplay.textContent = '查询失败';
            }
        };

        const showResult = (txId) => {
            const net = getNet();
            resultBox.classList.remove('hidden');
            errorBox.classList.add('hidden');
            txHashDisplay.textContent = txId;
            explorerLink.href = net.explorer + txId + '?cluster=' + net.cluster;
            explorerLink.classList.remove('hidden');
        };

        const showError = (msg) => {
            errorBox.classList.remove('hidden');
            resultBox.classList.add('hidden');
            errorBox.textContent = '❌ ' + msg;
        };

        const hideResult = () => {
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');
        };

        keyInput.addEventListener('input', connectWallet);
        newBtn.addEventListener('click', generateNew);
        copyBtn.addEventListener('click', () => {
            if (!keypair) return;
            navigator.clipboard.writeText(keypair.publicKey.toBase58()).then(() => alert('地址已复制')).catch(() => prompt('复制:', keypair.publicKey.toBase58()));
        });
        netSelect.addEventListener('change', () => {
            initConnection();
            if (keyInput.value.trim()) connectWallet();
            hideResult();
        });
        refreshBtn.addEventListener('click', updateBalance);

        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const val = btn.dataset.val;
                if (!connection || !keypair) return;
                const lamports = await connection.getBalance(keypair.publicKey);
                currentBalanceLamports = BigInt(lamports);
                if (val.endsWith('%')) {
                    const pct = parseInt(val) / 100;
                    if (pct === 1) {
                        if (currentBalanceLamports <= FEE_RESERVE_LAMPORTS) {
                            alert('余额不足以支付费用');
                            return;
                        }
                        const spendable = currentBalanceLamports - FEE_RESERVE_LAMPORTS;
                        amountInput.value = (Number(spendable) / solanaWeb3.LAMPORTS_PER_SOL).toFixed(9);
                    } else {
                        const amount = currentBalanceLamports * BigInt(Math.floor(pct * 1000000)) / 1000000n;
                        amountInput.value = (Number(amount) / solanaWeb3.LAMPORTS_PER_SOL).toFixed(9);
                    }
                } else {
                    amountInput.value = val;
                }
            });
        });

        sendBtn.addEventListener('click', async () => {
            const to = toInput.value.trim();
            if (!to) { alert('请输入接收地址'); return; }
            const amountStr = amountInput.value.trim();
            if (!amountStr || parseFloat(amountStr) <= 0) { alert('请输入有效金额'); return; }

            let toPubkey;
            try { toPubkey = new solanaWeb3.PublicKey(to); } catch (e) { alert('接收地址格式无效'); return; }

            const lamports = Math.floor(parseFloat(amountStr) * solanaWeb3.LAMPORTS_PER_SOL);
            const bal = await connection.getBalance(keypair.publicKey);
            if (lamports > bal) { alert('余额不足'); return; }

            sendBtn.disabled = true;
            sendBtn.textContent = '⏳ 发送中...';
            hideResult();

            try {
                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: keypair.publicKey,
                        toPubkey: toPubkey,
                        lamports: lamports
                    })
                );
                const txId = await solanaWeb3.sendAndConfirmTransaction(connection, transaction, [keypair]);
                showResult(txId);
                sendBtn.textContent = '✅ 已发送';
                setTimeout(() => {
                    sendBtn.disabled = false;
                    sendBtn.textContent = '发送';
                    updateBalance();
                }, 2000);
            } catch (e) {
                showError(e.message || e.reason || '发送失败');
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        });
    </script>
</body>
</html>
