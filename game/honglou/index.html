<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="红楼梦·宝玉传：一款纯文字的江湖人生模拟游戏。你是贾宝玉，可在府中谈情说爱、经商发财、读书科举、从军立功，乃至屯兵造反开创新朝。">
  <title>红楼梦·宝玉传</title>
  <style>
    :root {
      --ink: #2b2320;
      --paper: #f4eee0;
      --card: #fbf7ec;
      --card2: #f6efdd;
      --muted: #7a6f62;
      --line: #d8cfba;
      --cinnabar: #a62828;
      --cinnabar-dark: #7e1c1c;
      --gold: #c2a24a;
      --gold-dark: #9a7c2e;
      --green: #3c6e4f;
      --blue: #33556e;
      --danger: #b0331f;
      --shadow: 0 14px 40px rgba(60, 45, 25, .12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 85% -10%, rgba(194,162,74,.08), transparent 60%),
        repeating-linear-gradient(0deg, rgba(120,95,60,.028) 0 1px, transparent 1px 4px),
        var(--paper);
      font-family: Georgia, "Kaiti SC", "KaiTi", "STKaiti", "Songti SC", "Microsoft YaHei", serif;
    }
    button, input, select { font: inherit; color: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(43,35,32,.97);
      color: #f3ecdc;
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--cinnabar);
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
    }
    .topbar-inner {
      max-width: 1300px;
      margin: auto;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .seal {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #f5ead0;
      background: var(--cinnabar);
      border-radius: 6px;
      font: 900 15px "Kaiti SC", "STKaiti", serif;
      letter-spacing: .02em;
      box-shadow: inset 0 0 0 2px rgba(245,234,208,.35);
    }
    .brand b { display: block; font-size: 16px; letter-spacing: .28em; }
    .brand small { color: #b3a78f; font-size: 11px; letter-spacing: .14em; }
    .hud { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 4px 10px; min-width: 300px; }
    .stat { display: flex; flex-direction: column; line-height: 1.15; }
    .stat small { color: #a99b82; font-size: 10px; letter-spacing: .08em; }
    .stat b { font-size: 14px; font-weight: 700; }
    .stat b.t2 { color: #f0c674; }
    .stat b.t3 { color: #8fd0a5; }
    .stat b.t4 { color: #8fc7e8; }
    .stat b.t5 { color: #e8a58f; }
    .stat b.bad { color: #e0705a; }

    .layout { max-width: 1300px; margin: 18px auto 40px; padding: 0 20px; display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 16px; align-items: start; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px 20px 4px 4px;
      box-shadow: var(--shadow);
    }
    .panel-head {
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(166,40,40,.07), transparent 60%);
    }
    .panel-head h2 { margin: 0; font-size: 15px; letter-spacing: .2em; }
    .panel-head span { color: var(--muted); font-size: 12px; }

    .story { min-height: 420px; display: flex; flex-direction: column; }
    .story-head { display: flex; align-items: center; gap: 14px; }
    .story-head .time-chip { padding: 3px 10px; color: #f5ead0; background: var(--cinnabar); border-radius: 999px; font-size: 12px; letter-spacing: .1em; }
    .story-body { flex: 1; max-height: 560px; overflow-y: auto; padding: 18px 20px; line-height: 2; font-size: 15px; }
    .story-body .entry { margin: 0 0 14px; }
    .entry .t-time { color: var(--gold-dark); font-size: 12px; letter-spacing: .12em; display: block; }
    .entry.story { color: var(--ink); }
    .entry.event { color: var(--cinnabar-dark); font-weight: 700; }
    .entry.good { color: var(--green); }
    .entry.bad { color: var(--danger); }
    .entry.romance { color: #a43a5e; }
    .entry.battle { color: var(--blue); font-weight: 600; }
    .entry.money { color: var(--gold-dark); }
    .entry.muted { color: var(--muted); }
    .entry.script { font-style: italic; }

    .scene {
      padding: 12px 16px;
      margin: 0 0 12px;
      background: var(--card2);
      border-left: 4px solid var(--cinnabar);
      font-size: 15px;
      line-height: 1.95;
      color: #4a3f34;
      border-radius: 0 10px 10px 0;
    }
    .scene b { color: var(--cinnabar-dark); }

    .side { display: flex; flex-direction: column; gap: 12px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 12px 0; }
    .tab-btn {
      padding: 7px 13px;
      cursor: pointer;
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .1em;
      transition: .15s;
    }
    .tab-btn:hover { border-color: var(--gold); }
    .tab-btn.active { color: #f5ead0; background: var(--cinnabar); border-color: var(--cinnabar); }
    .tab-btn.locked { opacity: .45; cursor: not-allowed; }
    .tab-note { padding: 2px 14px 8px; color: var(--muted); font-size: 12px; }
    .actions { padding: 4px 12px 14px; display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 440px; overflow-y: auto; }
    .action-btn {
      position: relative;
      text-align: left;
      padding: 10px 12px 10px 46px;
      cursor: pointer;
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 4px 12px 4px 4px;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .action-btn:hover { transform: translateX(3px); border-color: var(--cinnabar); box-shadow: 0 4px 14px rgba(166,40,40,.1); }
    .action-btn.disabled { opacity: .45; cursor: not-allowed; }
    .action-btn.disabled:hover { transform: none; border-color: var(--line); box-shadow: none; }
    .action-btn .ab-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--cinnabar);
      border: 1px solid rgba(166,40,40,.35);
      border-radius: 50%;
      font-size: 13px;
    }
    .action-btn b { display: block; font-size: 14px; }
    .action-btn span { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 1px; }
    .action-btn .cost { color: var(--gold-dark); font-size: 11px; }

    .relations { max-width: 1300px; margin: 0 auto 40px; padding: 0 20px; }
    .rel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 14px; }
    .rel-item { display: flex; flex-direction: column; gap: 5px; padding: 9px 12px; background: var(--card2); border: 1px solid var(--line); border-radius: 4px 12px 4px 4px; }
    .rel-item .name { font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
    .rel-item .name em { color: var(--muted); font-style: normal; font-size: 11px; font-weight: 400; }
    .rel-bar { height: 7px; background: rgba(43,35,32,.08); border-radius: 99px; overflow: hidden; }
    .rel-bar i { display: block; height: 100%; background: linear-gradient(90deg, #d05c74, #a62828); border-radius: 99px; transition: width .4s; }
    .rel-item.spouse { border-color: var(--gold); }
    .rel-item.spouse .name { color: var(--cinnabar-dark); }

    .mkt-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px 2px;
      border-bottom: 1px dashed var(--line);
    }
    .mkt-info b { display: block; font-size: 14px; }
    .mkt-info b em { color: var(--cinnabar); font-style: normal; font-weight: 700; font-size: 11px; }
    .mkt-info small { color: var(--muted); font-size: 11px; }
    .mkt-price { font: 700 14px "Courier New", monospace; color: var(--gold-dark); white-space: nowrap; }
    .mkt-btn {
      padding: 5px 13px;
      cursor: pointer;
      color: #f5ead0;
      background: var(--cinnabar);
      border: 0;
      border-radius: 4px;
      font-size: 13px;
    }
    .mkt-btn.ghost { color: var(--ink); background: var(--card2); border: 1px solid var(--line); }
    .mkt-btn[disabled] { opacity: .4; cursor: not-allowed; }
    .reset-mini {
      padding: 4px 12px;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: .1em;
    }
    .reset-mini:hover { color: var(--cinnabar); border-color: var(--cinnabar); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 60;
      transform: translate(-50%, 20px);
      max-width: min(520px, calc(100% - 32px));
      padding: 12px 18px;
      color: #f3ecdc;
      background: rgba(43,35,32,.95);
      border-left: 5px solid var(--cinnabar);
      border-radius: 4px;
      box-shadow: 0 12px 34px rgba(0,0,0,.3);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      font-size: 14px;
      line-height: 1.6;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(30,24,20,.62);
      backdrop-filter: blur(3px);
    }
    .overlay .card {
      width: min(560px, 100%);
      max-height: 82vh;
      overflow-y: auto;
      padding: 26px 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px 26px 6px 6px;
      box-shadow: 0 24px 70px rgba(0,0,0,.4);
    }
    .overlay .card h2 { margin: 0 0 12px; color: var(--cinnabar-dark); font-size: 22px; letter-spacing: .1em; }
    .overlay .card .end-body { line-height: 2.1; color: #4a3f34; font-size: 15px; }
    .overlay .card .end-body b { color: var(--cinnabar-dark); }
    .overlay .card .btn-row { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      padding: 9px 18px;
      cursor: pointer;
      color: #f5ead0;
      background: var(--cinnabar);
      border: 0;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: .12em;
      transition: .15s;
    }
    .btn:hover { background: var(--cinnabar-dark); }
    .btn.ghost { color: var(--ink); background: var(--card2); border: 1px solid var(--line); }
    .btn.ghost:hover { border-color: var(--gold); }

    .story-body::-webkit-scrollbar, .actions::-webkit-scrollbar, .overlay .card::-webkit-scrollbar { width: 8px; }
    .story-body::-webkit-scrollbar-thumb, .actions::-webkit-scrollbar-thumb, .overlay .card::-webkit-scrollbar-thumb { background: #c9bda4; border-radius: 99px; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .side { order: -1; }
      .actions { max-height: 320px; }
      .story-body { max-height: 46vh; }
    }
    @media (max-width: 480px) {
      .layout { padding: 0 10px; margin-top: 10px; }
      .rel-grid { grid-template-columns: repeat(2, 1fr); }
      .story-body { padding: 14px 14px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="seal">梦</div>
        <div><b>红楼梦·宝玉传</b><small>HONG LOU MENG · LIFE SIM</small></div>
      </div>
      <div class="hud" id="hud"></div>
    </div>
  </header>

  <main class="layout">
    <section class="panel story">
      <div class="panel-head story-head">
        <h2>金陵纪事</h2>
        <span style="display:flex;align-items:center;gap:10px;"><span class="time-chip" id="timeChip"></span><button type="button" class="reset-mini" id="resetBtn">重开新篇</button></span>
      </div>
      <div class="story-body" id="storyBody"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head"><h2>去处</h2><span id="placeNote"></span></div>
        <div class="tabs" id="tabs"></div>
        <div class="tab-note" id="tabNote"></div>
        <div class="actions" id="actions"></div>
      </section>
    </aside>
  </main>

  <section class="relations">
    <div class="panel">
      <div class="panel-head"><h2>红颜知己</h2><span>姻缘未定，则凭心也</span></div>
      <div class="rel-grid" id="relGrid"></div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    (() => {
      'use strict';

      /* ============================================================
       *  基础数据
       * ============================================================ */
      const SAVE_KEY = 'honglouBaoyuV1';
      const SHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
      const SEASONS = ['春','夏','秋','冬'];
      const SHI_PER_DAY = 12;
      const DAY_PER_SEASON = 90;
      const SEASON_PER_YEAR = 4;

      const GOODS = {
        '粮食': { base: 60,  note: '五谷杂粮，年景不同价不同', s: [1.15, 0.9, 1.05, 1.1] },
        '绸缎': { base: 110, note: '苏杭上等绸缎，逢年过节俏', s: [1.0, 1.15, 1.25, 0.95] },
        '茶叶': { base: 90,  note: '明前龙井、武夷岩茶', s: [0.95, 1.2, 1.0, 1.05] },
        '瓷器': { base: 130, note: '景德镇官窑名瓷', s: [1.05, 1.0, 1.0, 1.1] },
        '药材': { base: 95,  note: '人参茯苓当归等', s: [1.2, 0.85, 0.9, 1.2] },
        '玉石': { base: 240, note: '和田玉、翡翠原石', s: [1.0, 1.0, 1.0, 1.25] },
        '马匹': { base: 320, note: '塞外良驹，边关紧俏', s: [0.9, 0.9, 1.2, 1.05] },
        '食盐': { base: 150, note: '朝廷专卖，利在暗中', s: [1.0, 1.0, 1.15, 1.0] },
      };
      const GOOD_KEYS = Object.keys(GOODS);

      const CIVIL_RANKS = ['白身','秀才','举人','贡士','进士','知县·正七品','同知·正六品','知府·正五品','道台·正四品','按察使·正三品','布政使·从二品','巡抚·正二品','尚书·正一品','大学士·拜相'];
      const CIVIL_MERIT_NEED = [0,0,0,0,0, 20, 45, 80, 130, 200, 290, 400, 540, 720];
      const MIL_RANKS = ['新兵','什长','百夫长','千夫长','裨将','偏将','总兵','大将军','镇国公','护国公·封侯拜相'];
      const MIL_MERIT_NEED = [0, 10, 25, 45, 75, 115, 165, 230, 320, 450];

      const CHARS = {
        daiyu:   { name: '林黛玉', title: '姑苏林家·潇湘妃子', where: '潇湘馆', after: 'garden', asc: 'learn', atk: '敏' },
        baochai: { name: '薛宝钗', title: '金陵薛家·蘅芜君', where: '蘅芜苑', after: 'garden', asc: 'fame', atk: '稳' },
        xiangyun:{ name: '史湘云', title: '保龄侯史府·枕霞旧友', where: '枕霞阁', after: 'garden', asc: 'health', atk: '爽' },
        miaoyu:  { name: '妙玉',   title: '栊翠庵·槛外人', where: '栊翠庵', after: 'garden', asc: 'charm', atk: '冷' },
        xiren:   { name: '袭人',   title: '怡红院首席大丫鬟', where: '怡红院', after: 'home', asc: 'tael', atk: '贤' },
        qingwen: { name: '晴雯',   title: '怡红院大丫鬟·芙蓉女儿', where: '怡红院', after: 'home', asc: 'charm', atk: '俏' },
        sheyue:  { name: '麝月',   title: '怡红院丫鬟·守灯人', where: '怡红院', after: 'home', asc: 'health', atk: '温' },
      };

      const MARRIAGE_EFFECTS = {
        daiyu:   { learn: 20, maxStamina: -10, charm: 6,  text: '你与黛玉结为连理。她为你红袖添香，从此书房里多了一缕药香与诗魂；只是她身子弱，你须时时看顾。' },
        baochai: { fame: 22, tael: 600, learn: 6, text: '你与宝钗结为夫妇。金玉良缘成真，薛家陪嫁丰厚，宝钗持家有道，府中上下无不敬服。' },
        xiangyun:{ health: 18, stamina: 8, charm: 4, text: '你与湘云成婚。她爱说爱笑，最是爽利，夜里同你划拳行令，把日子过成了诗。' },
        miaoyu:  { charm: 12, learn: 8, text: '槛外人亦动了凡心。妙玉还俗嫁你，清冷之人温柔起来，竟比寻常女子更痴。' },
        xiren:   { fame: 6, tael: 300, health: 6, text: '袭人终得正果，名正言顺地做了你的屋里人。她侍奉起居，井井有条，是你的贤内助。' },
        qingwen: { charm: 10, health: -6, text: '晴雯心比天高，仍愿意跟你。她虽性烈，却把一腔痴心都给了你。' },
        sheyue:  { health: 10, stamina: 6, text: '麝月安静温厚，一心一意跟着你，把你伺候得妥妥帖帖。' },
      };

      /* ============================================================
       *  状态
       * ============================================================ */
      let S;
      const defState = () => ({
        name: '贾宝玉',
        hours: 0,
        tael: 200,
        fame: 30,
        learn: 15,
        martial: 10,
        charm: 25,
        stamina: 100,
        maxStamina: 100,
        health: 100,
        stock: {},        // 囤货
        prices: {},       // 市价浮动
        love: { daiyu: 30, baochai: 25, xiangyun: 15, miaoyu: 8, xiren: 45, qingwen: 40, sheyue: 25 },
        married: null,
        career: null,     // 'civil' | 'military'
        civilRank: 0,
        civilMerit: 0,
        milRank: 0,
        milMerit: 0,
        soldiers: 0,
        food: 0,
        rebelStage: 0,    // 0 未造反 1 起兵 2 割据 3 决战
        events: {},       // 事件标记
        log: [],
      });
      function load() {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            const d = defState();
            Object.assign(d, parsed);
            return d;
          }
        } catch (e) { /* ignore */ }
        return defState();
      }
      function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
      function reset() { S = defState(); localStorage.removeItem(SAVE_KEY); initStory(); }

      /* ============================================================
       *  时间与工具
       * ============================================================ */
      const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
      const pick = arr => arr[Math.floor(Math.random() * arr.length)];
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      function timeInfo() {
        const shi = S.hours % SHI_PER_DAY;
        const day = Math.floor(S.hours / SHI_PER_DAY) % DAY_PER_SEASON + 1;
        const season = Math.floor(S.hours / (SHI_PER_DAY * DAY_PER_SEASON)) % SEASON_PER_YEAR;
        const year = Math.floor(S.hours / (SHI_PER_DAY * DAY_PER_SEASON * SEASON_PER_YEAR));
        return { shi, day, season, year, age: 14 + year };
      }
      const timeChip = () => { const t = timeInfo(); return `第${t.year + 1}年·${SEASONS[t.season]}·${SHI[t.shi]}时·${t.day}日·年方${t.age}`; };

      function addLog(text, type) {
        S.log.push({ t: timeChip(), text, type: type || 'story' });
        if (S.log.length > 400) S.log.splice(0, S.log.length - 400);
      }
      function passTime(shi) {
        for (let i = 0; i < shi; i++) {
          S.hours += 1;
          autoYearly();
          if (S.gameOver) break;
        }
        checkEvents();
      }

      function say(msg) { addLog(msg, 'muted'); }
      function story(msg) { addLog(msg, 'story'); }
      function event(msg) { addLog(msg, 'event'); }
      function good(msg) { addLog(msg, 'good'); }
      function bad(msg) { addLog(msg, 'bad'); }
      function romance(msg) { addLog(msg, 'romance'); }
      function money(msg) { addLog(msg, 'money'); }
      function battle(msg) { addLog(msg, 'battle'); }
      function script(msg) { addLog(msg, 'script'); }

      function gainTael(n, reason) {
        S.tael = Math.max(0, Math.round(S.tael + n));
        if (n !== 0) money(`${n > 0 ? '得' : '支'}银 ${Math.abs(n)} 两。${reason ? '（' + reason + '）' : ''}`);
      }
      function spendStamina(n) {
        S.stamina = Math.max(0, S.stamina - n);
        if (S.stamina <= 0) {
          bad('你筋疲力尽，瘫倒在床榻上……');
          S.health = Math.max(1, S.health - 6);
          S.stamina = 0;
        }
      }
      function restDo(n) {
        S.stamina = clamp(S.stamina + n, 0, S.maxStamina);
        if (S.health < 100) S.health = Math.min(100, S.health + (S.health > 70 ? 1 : 2));
        good(`歇息片刻，体力回复 ${n} 点。`);
      }

      /* ============================================================
       *  自动事件（年份推进）
       * ============================================================ */
      function autoYearly() {
        const t = timeInfo();
        if (S.health <= 0) return gameOver('病逝', '红消香断');
        if (!S.events.yuanchun && t.year >= 1 && t.season === 0) {
          S.events.yuanchun = 1;
          event('—— 元春封妃 ——\n忽见赖大带进几个报喜的人来，一路嚷道：「贵妃娘娘晋封凤藻宫尚书，加封贤德妃！」荣国府上下皆换了新衣，人人面有喜色。');
          S.fame += 50; S.tael += 1000;
          good('元妃娘娘封赏，府上名声大振，声望 +50，赏银 1000 两。');
          story('贾母笑得合不拢嘴：「到底是娘娘省亲在即，我贾家又添了光彩！」你在一旁想着那从未见过的姐姐，心里又酸又喜。');
        }
        if (!S.events.garden && S.events.yuanchun && t.year >= 1 && t.season === 1) {
          S.events.garden = 1;
          event('—— 大观园落成 ——\n为迎接贵妃省亲，宁荣二府将花园丈量起来，连缀各处亭台，白石为栏、环抱池沼，竟造出一座人间仙境，名曰大观园。');
          good('大观园建成，众姊妹移居园中，你与她们亲近的机会多了。');
          story('园中贾政对众人道：「你们且好生照看园子，娘娘省亲之日，莫要失了礼数。」你早已溜去潇湘馆，要看黛玉的新居。');
        }
        if (!S.events.conscript && t.year >= 2 && t.season === 0) {
          S.events.conscript = 1;
          event('—— 边疆征兵 ——\n北疆鞑靼屡犯边境，边报一日三至，朝廷下诏各府招募义勇，粮饷从优。街巷之中，但见招兵旗随风猎猎。');
          story('贾政看着你，叹道：「宝玉，你也老大不小了。读书也罢，从军也罢，总该有个正经前程。」');
        }
        if (!S.events.crisis && t.year >= 3 && t.season === 3) {
          S.events.crisis = 1;
          if (S.career === null && S.fame < 120) {
            event('—— 家族危机 ——\n贾府子弟仗势胡为，御史一本参到御前。上谕切责，命查贾府家产。风声鹤唳，下人纷纷告假出府。');
            S.fame = Math.max(5, S.fame - 30); S.tael = Math.max(20, Math.round(S.tael * 0.5));
            bad('贾府被抄检，家财去半，名声受损。你第一次尝到了世态炎凉。');
            story('王夫人拉着你的手落泪：「宝玉，若是家败了，你便去读书、去从军，总要自己立起来……」');
          } else {
            event('—— 朝局动荡 ——\n皇帝多年不上朝，权臣当道，边患四起，天下渐有板荡之象。');
            story('酒楼茶馆里，有人低声议论：「这天，怕是要变了。」你心中一动，若有所思。');
          }
        }
        if (S.events.crisis && S.career === 'military' && S.milRank >= 2 && !S.events.rebelWindow) {
          S.events.rebelWindow = 1;
          event('—— 天下大乱 ——\n京师传来噩耗：皇帝驾崩，藩王争立，群雄割据。你手握重兵，麾下将士齐声请愿：「将军，反了吧！」');
        }
      }

      /* ============================================================
       *  好感度与姻缘
       * ============================================================ */
      function loveStage(key) {
        const v = S.love[key];
        if (v >= 90) return 4;
        if (v >= 70) return 3;
        if (v >= 40) return 2;
        if (v >= 20) return 1;
        return 0;
      }
      function visitChar(key) {
        const c = CHARS[key];
        const stage = loveStage(key);
        const lines = LOVE_LINES[key] ? LOVE_LINES[key][stage] : null;
        if (lines) romance(lines);
        else romance(`你在${c.where}与${c.name}闲话半日。`);
        const gain = 2 + stage + (c.after === 'garden' && S.events.garden ? 1 : 0);
        S.love[key] = Math.min(100, S.love[key] + gain);
        if (c.asc === 'charm' && Math.random() < .4) { S.charm = Math.min(100, S.charm + 1); say('谈吐风雅，魅力渐长。'); }
        if (c.asc === 'learn' && Math.random() < .4) { S.learn += 1; say('听她讲诗论文，才学微增。'); }
        if (c.asc === 'tael' && Math.random() < .3 && S.tael < 300) { gainTael(8, '她私下贴补你'); }
        if (S.love[key] >= 90 && S.married !== key && timeInfo().age >= 16 && S.tael >= 300) {
          event(`—— 情定 ——\n你与${c.name}两心相印，情根深种。依礼，该请媒人上门提亲了。`);
        }
        spendStamina(8);
        passTime(1);
      }

      function propose(key) {
        const c = CHARS[key];
        if (S.married) return;
        if (S.tael < 300) return bad('提亲聘礼、酒席花费不小，你银两不足。');
        S.tael -= 300;
        S.married = key;
        const ef = MARRIAGE_EFFECTS[key];
        for (const k in ef) {
          if (k === 'text') continue;
          if (k === 'maxStamina') S.maxStamina = Math.max(50, S.maxStamina + ef[k]);
          else if (k === 'tael') S.tael += ef[k];
          else S[k] = S[k] + ef[k];
        }
        S.love[key] = 100;
        event(`—— 大婚 ——\n你与${c.name}三拜天地，结为夫妻。${ef.text}`);
        S.fame += 12;
        story(`洞房花烛夜，你看着红烛下的人影，恍惚觉得，这一生若能如此，也算不负此生了。`);
        passTime(2);
      }

      /* ============================================================
       *  经商
       * ============================================================ */
      function jitter() {
        if (!S.prices) S.prices = {};
        for (const k of GOOD_KEYS) {
          const cur = S.prices[k] == null ? 1 : S.prices[k];
          S.prices[k] = clamp(cur * (0.9 + Math.random() * 0.2), 0.55, 1.7);
        }
      }
      function marketPrice(key) {
        const g = GOODS[key];
        const t = timeInfo();
        const m = S.prices && S.prices[key] != null ? S.prices[key] : 1;
        let p = g.base * g.s[t.season] * m;
        if (S.events.conscript && key === '粮食') p *= 1.3;
        if (S.events.conscript && key === '马匹') p *= 1.25;
        return Math.round(p);
      }
      function buyGood(key) {
        const price = marketPrice(key);
        if (S.tael < price) return bad('银两不足，买不起。');
        S.tael -= price;
        S.stock[key] = (S.stock[key] || 0) + 1;
        money(`购得 ${key} 一件，费银 ${price} 两。`);
        jitter();
        spendStamina(3); passTime(1);
      }
      function sellGood(key) {
        if (!(S.stock[key] > 0)) return bad(`你手上并没有${key}。`);
        const price = marketPrice(key);
        S.stock[key] -= 1;
        S.tael += price;
        money(`售出 ${key} 一件，得银 ${price} 两。`);
        jitter();
        spendStamina(3); passTime(1);
      }
      function openMarket() {
        let div = document.getElementById('marketModal');
        if (!div) {
          div = document.createElement('div');
          div.id = 'marketModal';
          div.className = 'overlay';
          document.body.appendChild(div);
        }
        div.innerHTML = `<div class="card">
          <div class="panel-head" style="margin:-26px -28px 14px;border-radius:6px 26px 0 0;padding:16px 28px;"><h2>街市行市</h2><span>春夏秋冬，价有贵贱，买贱卖贵</span></div>
          ${GOOD_KEYS.map(k => {
            const p = marketPrice(k);
            const st = S.stock[k] || 0;
            const t = timeInfo();
            const g = GOODS[k];
            const tip = p > g.base * g.s[t.season] * 1.1 ? '贵' : p < g.base * g.s[t.season] * 0.9 ? '贱' : '平';
            return `<div class="mkt-row">
              <div class="mkt-info"><b>${k} <em>${tip}</em></b><small>${g.note} · 持仓 ${st}</small></div>
              <div class="mkt-price">${p} 两</div>
              <button data-act="buy" data-k="${k}" class="mkt-btn" ${S.tael < p ? 'disabled' : ''}>买</button>
              <button data-act="sell" data-k="${k}" class="mkt-btn ghost" ${st <= 0 ? 'disabled' : ''}>卖</button>
            </div>`;
          }).join('')}
          <div class="btn-row"><button id="mktClose" class="btn ghost">离 去</button></div>
        </div>`;
        div.querySelectorAll('.mkt-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (btn.disabled) return;
            const k = btn.dataset.k;
            if (btn.dataset.act === 'buy') buyGood(k); else sellGood(k);
            save(); render();
            openMarket();
          });
        });
        div.querySelector('#mktClose').addEventListener('click', () => div.remove());
      }
      function lookMarket() {
        say('—— 行市 ——');
        for (const k of GOOD_KEYS) {
          const p = marketPrice(k);
          const g = GOODS[k];
          const t = timeInfo();
          const tip = p > g.base * g.s[t.season] * 1.1 ? ' 贵' : p < g.base * g.s[t.season] * 0.9 ? ' 贱' : '';
          money(`${k}：${p} 两${tip}`);
        }
        story('你在街市里转了一圈，问了问各铺行情。');
        passTime(1);
      }

      /* ============================================================
       *  科举
       * ============================================================ */
      function examChance(need) {
        return clamp(0.15 + (S.learn - need) / 120 + S.fame / 300, 0.05, 0.95);
      }
      function takeExam(stage) {
        const exams = [
          { name: '院试', need: 40, fee: 30, r0: 0, r1: 1, text: '院试一场，主考学政高坐堂上。你提笔蘸墨，胸中千卷滚滚而来。' },
          { name: '乡试', need: 65, fee: 60, r0: 1, r1: 2, text: '秋闱乡试，贡院号舍逼仄。你三场下来，眼窝深陷，却自觉颇有所得。' },
          { name: '会试', need: 90, fee: 120, r0: 2, r1: 3, text: '春闱会试，天下英才云集京城。你文章如行云流水，考官阅罢抚掌称善。' },
          { name: '殿试', need: 115, fee: 200, r0: 3, r1: 4, text: '紫禁城金銮殿上，天子亲策。你应答如流，龙颜大悦。' },
        ];
        const ex = exams[stage];
        if (S.civilRank < ex.r0) return bad('你功名未达，尚不可应试。');
        if (S.learn < ex.need) return bad(`你自忖才学不足（${ex.learn}），此时应试必败。`);
        if (S.tael < ex.fee) return bad(`应试盘缠、座师礼仪费共 ${ex.fee} 两，你拿不出。`);
        S.tael -= ex.fee;
        story(ex.text);
        if (Math.random() < examChance(ex.need)) {
          S.civilRank = ex.r1;
          S.fame += 15;
          good(`—— 金榜题名 ——\n你中了${CIVIL_RANKS[ex.r1]}！报喜的人敲锣打鼓而来，贾府上下欢腾。声望 +15。`);
          if (ex.r1 === 4) {
            event('—— 殿试及第，赐官 ——\n钦点进士，授江南某县知县。你收拾行装，赴任而去。');
            S.civilRank = 5;
            S.career = 'civil';
            S.civilMerit = 0;
            story('临行前，众姊妹来送。黛玉将一方旧帕塞进你手中，低声道：「早些回来。」');
          }
        } else {
          S.fame = Math.max(0, S.fame - 5);
          bad(`可惜，此次${ex.name}落第。你垂头丧气地回家，白费了 ${ex.fee} 两盘缠。`);
          story('贾政听闻，劈头骂了一顿：「不肖子孙！」你越发觉得读书无趣。');
        }
        spendStamina(15); passTime(4);
      }
      function serveOfficial() {
        if (S.career !== 'civil') return;
        const t = timeInfo();
        const gain = Math.round(4 + S.fame / 25 + Math.random() * 4);
        S.civilMerit += gain;
        good(`你处理积案、修堤办学，政绩卓然。治绩 +${gain}（当前 ${S.civilMerit}/${CIVIL_MERIT_NEED[S.civilRank + 1] || '满'}）。`);
        const salary = 20 + S.civilRank * 15;
        gainTael(salary, '俸禄');
        S.fame += 2;
        if (S.civilRank + 1 < CIVIL_RANKS.length && S.civilMerit >= CIVIL_MERIT_NEED[S.civilRank + 1]) {
          S.civilRank += 1;
          event(`—— 吏部考核升迁 ——\n你官声卓著，擢升为${CIVIL_RANKS[S.civilRank]}。`);
          if (S.civilRank === CIVIL_RANKS.length - 1) {
            return gameOver('位极人臣', '文官至尊');
          }
        }
        spendStamina(12); passTime(2);
      }

      /* ============================================================
       *  从军
       * ============================================================ */
      function enlist() {
        if (S.martial < 40) return bad('你自幼娇生惯养，这般身手入了军营，只怕熬不过三日。先去演武场练练。');
        if (S.tael < 50) return bad('入伍打点、置办行头需 50 两。');
        S.tael -= 50;
        S.career = 'military';
        S.milRank = 0;
        S.milMerit = 0;
        event('—— 投军 ——\n你脱了绫罗绸缎，换上一身窄袖戎衣，拜别祖母与母亲，跨马出了神京，往北疆大营而去。');
        story('军中校尉看你细皮嫩肉，嗤笑道：「富家公子，怕是连刀都提不动！」你攥紧了拳头。');
        passTime(6);
      }
      function drill() {
        const g = 2 + Math.floor(Math.random() * 2);
        S.martial += g;
        good(`烈日之下，你与士卒同练枪棒。武艺 +${g}（当前 ${S.martial}）。`);
        S.health = Math.max(1, S.health - 2);
        spendStamina(18); passTime(2);
      }
      function battleIt() {
        const win = Math.random() < clamp(0.35 + S.martial / 200 + (S.soldiers > 0 ? 0.05 : 0), 0.15, 0.92);
        battle('—— 沙场对阵 ——\n烽烟蔽日，胡骑卷地而来。你勒马横枪，背后大纛猎猎作响。');
        if (win) {
          const merit = rnd(3, 6);
          const reward = rnd(30, 80);
          S.milMerit += merit;
          S.martial += 1;
          S.fame += 4;
          S.tael += reward;
          good(`此战大捷，斩首三百。军功 +${merit}，赏银 ${reward} 两，声望 +4。`);
          if (S.milRank + 1 < MIL_RANKS.length && S.milMerit >= MIL_MERIT_NEED[S.milRank + 1]) {
            S.milRank += 1;
            event(`—— 升官 ——\n军中论功行赏，你升任${MIL_RANKS[S.milRank]}。`);
            S.tael += S.milRank * 50;
            good(`元帅设宴犒赏，另有赏银 ${S.milRank * 50} 两。`);
            if (S.milRank === MIL_RANKS.length - 1) {
              S.events.rebelWindow = 1;
              return gameOver('封侯拜相', '武勋至尊');
            }
          }
        } else {
          const inj = rnd(15, 35);
          S.health -= inj;
          bad(`此战不利，你身负重伤，被亲兵拼死救回。健康 -${inj}（当前 ${S.health}）。`);
          if (S.health <= 0) return gameOver('战死沙场', '马革裹尸');
        }
        spendStamina(25); passTime(4);
      }

      /* ============================================================
       *  造反
       * ============================================================ */
      function recruitSoldiers() {
        const cost = 100;
        if (S.tael < cost) return bad('募兵粮饷不足。');
        const gain = Math.round(30 + S.fame / 4);
        S.tael -= cost;
        S.soldiers += gain;
        good(`你散财募兵，得壮丁 ${gain} 人。麾下现有兵 ${S.soldiers} 人。`);
        spendStamina(8); passTime(2);
      }
      function hoardFood() {
        const cost = 50;
        if (S.tael < cost) return bad('购粮银两不足。');
        S.tael -= cost;
        S.food += 120;
        good(`你囤积粮草 ${120} 石，仓廪渐丰（现有 ${S.food} 石）。`);
        spendStamina(8); passTime(2);
      }
      function rebelNow() {
        if (!S.events.rebelWindow && !S.events.crisis) return bad('如今天下尚算太平，贸然起事必遭围剿。');
        if (S.fame < 60) return bad('你声名不显，将士未必心服。');
        if (S.soldiers < 1000) return bad(`麾下只有 ${S.soldiers} 人，恐难成事（至少需千军）。`);
        if (S.food < 2000) return bad(`粮草不足 ${S.food} 石（至少需 2000 石）。`);
        if (S.rebelStage !== 0) return bad('你已起兵。');
        S.rebelStage = 1;
        event('—— 起兵 ——\n这一夜，你召集诸将，历数朝廷之弊，振臂一呼：「苍生何辜，天下共逐之！」三军应声，声震四野。');
        S.fame += 20;
        battle('你率军攻取临城，城中守军不战而降。你秋毫无犯，开仓放粮，百姓箪食壶浆以迎。');
        good('—— 初战告捷 ——\n你据有一城，树旗自立。声望 +20。');
        S.rebelStage = 2;
        S.soldiers = Math.max(1, S.soldiers - rnd(100, 300));
        passTime(10);
      }
      function rebelAdvance() {
        if (S.rebelStage !== 2) return bad('还未到决战之时。');
        if (S.soldiers < 2000) return bad(`兵不满两千（现 ${S.soldiers} 人），决战无望。`);
        if (S.food < 3000) return bad(`粮草不足（现 ${S.food} 石），大军难以为继。`);
        const strength = clamp(0.3 + S.martial / 150 + S.fame / 150, 0.2, 0.95);
        battle('—— 决战 ——\n两军会战于中原旷野。你身先士卒，直取敌帅中军。');
        if (Math.random() < strength) {
          S.rebelStage = 3;
          event('—— 天下一统 ——\n王旗所指，无不披靡。三月后，你率军入京，百官俯首，迎你入主大统。');
          return gameOver('开创新朝', '九五之尊');
        } else {
          bad('此役惨败，将士死伤大半。你收拾残兵，退守山泽。');
          S.soldiers = Math.round(S.soldiers * 0.4);
          S.health -= 20;
          if (S.health <= 0) return gameOver('兵败身死', '霸业成空');
        }
        spendStamina(20); passTime(8);
      }

      /* ============================================================
       *  自由行动与赌博
       * ============================================================ */
      function gamble() {
        const bet = rnd(10, 60);
        if (S.tael < bet) return bad('你摸了摸口袋，分文不剩。');
        const roll = Math.random();
        if (roll < 0.35) {
          const win = bet * rnd(2, 5);
          S.tael += win;
          money(`手气大旺，押 ${bet} 两竟赢了 ${win} 两！你眉开眼笑。`);
        } else if (roll < 0.7) {
          S.tael -= bet;
          bad(`骰子一掷，${bet} 两银钱打了水漂。`);
        } else {
          S.tael -= bet;
          bad(`不但输光，还倒欠了利钱 ${Math.round(bet/2)} 两。`);
          S.tael = Math.max(0, S.tael - Math.round(bet / 2));
        }
        S.fame = Math.max(0, S.fame - 1);
        spendStamina(6); passTime(2);
      }
      function news() {
        const n = pick([
          '街市传闻，今秋粮价要涨，盐价要跌。',

                } });
              acts.push({ name: '遣使回京', desc: '修书一封，问候家中（耗银2两）', cost: '-', run() {
                  if (S.tael < 2) return bad('连捎信的家书钱都凑不出。');
                  S.tael -= 2;
                  story('你写了一封家书，报个平安，又絮絮问了园中诸人安好。');
                  if (S.married) romance(`信末你写道：「与卿虽隔万里，此心如一。」`);
                  passTime(1);
                } });
              acts.push({ name: '振臂谋反', desc: '若天下有变，则拥兵自立', cost: '-', run() {
                  if (S.events.rebelWindow) {
                    if (S.rebelStage === 0) rebelNow();
                    else if (S.rebelStage === 2) rebelAdvance();
                  } else {
                    say('如今天下未乱，此时谋反无异于飞蛾扑火。你需等待时机。');
                  }
                } });
              return acts;
            }
            if (S.career === 'civil') {
              acts.push({ name: '身在朝堂', desc: '你已走文官之路', cost: '-', run() { say('你已在朝为官，岂可轻入行伍。'); } });
              return acts;
            }
            if (!S.events.conscript) {
              acts.push({ name: '尚未征兵', desc: '边关暂无动静，无从投军', cost: '-', run() { say('如今太平，军营不收闲人。'); } });
              return acts;
            }
            acts.push({ name: '报名入伍', desc: '投身边关，建功立业（需武艺40、银50两）', cost: '体力-20', run: enlist });
            acts.push({ name: '先去练武', desc: '武艺不精，难在军中立足', cost: '-', run() { say(`你武艺尚浅（${S.martial}），先回府中演武场磨炼，至少练到 40 再投军。`); } });
            return acts;
          }
        },
        {
          id: 'rebel', name: '图谋', note: '屯兵造反之路',
          actions() {
            const acts = [];
            if (S.rebelStage >= 1) {
              acts.push({ name: '募兵', desc: `散财招兵（每百两银得${30 + Math.round(S.fame / 4)}人）`, cost: '银100两', run: recruitSoldiers });
              acts.push({ name: '囤粮', desc: '购储军粮（每五十两银得120石）', cost: '银50两', run: hoardFood });
              if (S.rebelStage === 2) acts.push({ name: '出兵决战', desc: '挥师东进，问鼎中原', cost: '倾巢而出', run: rebelAdvance });
              acts.push({ name: '整军经武', desc: '操练部曲，将卒用命', cost: '体力-20', run() {
                  S.martial += 1; S.soldiers += rnd(5, 20); good('你亲自督练兵卒，军容日盛。武艺+1，兵员略增。'); spendStamina(20); passTime(2);
                } });
              return acts;
            }
            const crisis = !!S.events.crisis || !!S.events.rebelWindow;
            acts.push({ name: '暗中募兵', desc: '散财豢养死士（每百两银得人）', cost: '银100两', run: recruitSoldiers });
            acts.push({ name: '囤积粮草', desc: '购储粮食，以备不测', cost: '银50两', run: hoardFood });
            if (!crisis) acts.push({ name: '静观其变', desc: '如今天下尚安，暂且蛰伏', cost: '-', run() { say('你自忖：时机未到，须静待天下有变。'); passTime(1); } });
            if (crisis) acts.push({ name: '举兵起事', desc: '趁乱而起，逐鹿天下', cost: '孤注一掷', run: rebelNow });
            acts.push({ name: '回府读书', desc: '造反之事，且从长计议', cost: '-', run() { story('你暂且按下心思。'); setLoc('home'); } });
            return acts;
          }
        },
      ];

      let currentLoc = 'home';
      const setLoc = id => { currentLoc = id; render(); };

      /* ============================================================
       *  渲染
       * ============================================================ */
      const $ = id => document.getElementById(id);

      function renderHud() {
        const t = timeInfo();
        const parts = [
          ['年龄', t.age, ''],
          ['银两', S.tael, 't2'],
          ['声望', S.fame, ''],
          ['才学', S.learn, ''],
          ['武艺', S.martial, ''],
          ['魅力', S.charm, ''],
          ['体力', `${S.stamina}/${S.maxStamina}`, S.stamina <= 20 ? 'bad' : ''],
          ['健康', S.health, S.health <= 30 ? 'bad' : ''],
        ];
        $('hud').innerHTML = parts.map(p =>
          `<div class="stat"><small>${p[0]}</small><b class="${p[2]}">${p[1]}</b></div>`).join('') +
          (S.married ? `<div class="stat"><small>妻</small><b class="t3">${CHARS[S.married].name}</b></div>` : '') +
          (S.career === 'civil' ? `<div class="stat"><small>官职</small><b class="t4">${CIVIL_RANKS[S.civilRank]}</b></div>` : '') +
          (S.career === 'military' ? `<div class="stat"><small>军职</small><b class="t5">${MIL_RANKS[S.milRank]}</b></div>` : '') +
          (S.rebelStage >= 1 ? `<div class="stat"><small>义军</small><b class="t5">${S.soldiers}兵</b></div>` : '');
        $('timeChip').textContent = timeChip();
      }

      function renderStory() {
        const body = $('storyBody');
        body.innerHTML = S.log.map(e =>
          `<div class="entry ${e.type}"><span class="t-time">${e.t}</span>${e.text.replace(/\n/g, '<br>')}</div>`).join('');
        body.scrollTop = body.scrollHeight;
      }

      function renderTabs() {
        const tabs = $('tabs');
        const showRebel = S.rebelStage >= 1 || !!S.events.crisis || !!S.events.rebelWindow || S.milRank >= 3 || S.soldiers > 0 || S.food > 0;
        const showArmy = !!S.events.conscript || S.career === 'military';
        const lockedMap = {
          exam: S.career === 'military',
          army: false,
          rebel: false,
        };
        tabs.innerHTML = LOCATIONS.filter(l => l.id !== 'rebel' || showRebel).map(l => {
          const active = l.id === currentLoc ? ' active' : '';
          const locked = lockedMap[l.id] ? ' locked' : '';
          return `<button type="button" class="tab-btn${active}${locked}" data-loc="${l.id}">${l.name}</button>`;
        }).join('');
        tabs.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            if (btn.classList.contains('locked')) return;
            setLoc(btn.dataset.loc);
          });
        });
        $('tabNote').textContent = showRebel && currentLoc !== 'rebel'
          ? '天下板荡，图谋之路已向你敞开……'
          : (currentLoc === 'rebel' && !showRebel ? '静待时变。' : '');
      }

      function renderActions() {
        const loc = LOCATIONS.find(l => l.id === currentLoc);
        const acts = loc.actions();
        const box = $('actions');
        box.innerHTML = '';
        acts.forEach(a => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'action-btn';
          btn.innerHTML = `<span class="ab-icon">${a.name.slice(0, 1)}</span><b>${a.name}</b><span>${a.desc}</span>${a.cost && a.cost !== '-' ? `<span class="cost">· ${a.cost}</span>` : ''}`;
          btn.addEventListener('click', () => {
            if (btn.classList.contains('disabled')) return;
            a.run();
            save();
            render();
          });
          box.appendChild(btn);
        });
      }

      function renderRel() {
        const grid = $('relGrid');
        const keys = Object.keys(CHARS).filter(k => CHARS[k].after === 'garden' ? S.events.garden : true);
        grid.innerHTML = keys.map(k => {
          const c = CHARS[k];
          const v = S.love[k];
          const spouse = S.married === k ? ' spouse' : '';
          const label = v >= 90 ? '情深' : v >= 70 ? '亲昵' : v >= 40 ? '熟稔' : v >= 20 ? '相识' : '生疏';
          const hidden = !S.events.garden && c.after === 'garden' ? '（待大观园）' : label;
          return `<div class="rel-item${spouse}">
            <div class="name">${c.name}<em>${spouse ? '·妻' : hidden}</em></div>
            <div class="rel-bar"><i style="width:${v}%"></i></div>
          </div>`;
        }).join('');
        $('placeNote').textContent = (LOCATIONS.find(l => l.id === currentLoc) || {}).note || '';
      }

      function render() {
        renderHud();
        renderStory();
        renderTabs();
        renderActions();
        renderRel();
        if (S.gameOver) renderEnd();
      }

      /* ============================================================
       *  结局遮罩
       * ============================================================ */
      function renderEnd() {
        if (!S.gameOver) return;
        const e = ENDINGS[S.gameOver.id] || { title: S.gameOver.id, body: '' };
        const t = timeInfo();
        let div = document.getElementById('endOverlay');
        if (!div) {
          div = document.createElement('div');
          div.id = 'endOverlay';
          div.className = 'overlay';
          document.body.appendChild(div);
        }
        div.innerHTML = `<div class="card">
          <p style="color:var(--gold-dark);margin:0 0 4px;letter-spacing:.2em;font-size:12px;">结局 · ${S.gameOver.title}</p>
          <h2>${e.title}</h2>
          <div class="end-body">${e.body}</div>
          <p class="muted" style="color:var(--muted);margin-top:16px;font-size:13px;">享年 ${t.age} 岁 · 在位年份 ${t.year + 1} · 声望 ${S.fame} · 银 ${S.tael} 两<br>${S.married ? '与' + CHARS[S.married].name + '相守终身' : '终身未娶，孤身一人'}</p>
          <div class="btn-row">
            <button type="button" class="btn" id="restartBtn">再入红尘</button>
            <button type="button" class="btn ghost" id="closeEndBtn">留在此页</button>
          </div>
        </div>`;
        div.querySelector('#restartBtn').addEventListener('click', () => { reset(); document.getElementById('endOverlay').remove(); });
        div.querySelector('#closeEndBtn').addEventListener('click', () => div.remove());
      }

      /* ============================================================
       *  事件触发器（跨动作检查）
       * ============================================================ */
      function checkEvents() {
        const t = timeInfo();
        autoYearly();
        if (S.health <= 0 && !S.gameOver) gameOver('病逝', '红消香断');
        // 提亲入口
        for (const k in CHARS) {
          if (S.love[k] >= 90 && !S.married && !S.events['propose' + k] && t.age >= 16 && S.tael >= 300) {
            S.events['propose' + k] = 1;
            event(`—— 提亲之机 ——\n你与${CHARS[k].name}两情相悦。现银两充裕，可向府中长辈表明心意，请媒提亲。`);
            // 自动在府内出现提亲按钮
          }
        }
      }

      /* ============================================================
       *  初始化
       * ============================================================ */
      function initStory() {
        if (S.log.length > 0) { save(); render(); return; }
        script('满纸荒唐言，一把辛酸泪。都云作者痴，谁解其中味。');
        story('那日仲春天气，荣国府中花木蓊郁，柳丝如烟。你从外书房回来，袭人迎上来替你解下外衣，笑道：「二爷，老太太正寻你呢，说是宫里来了消息。」');
        story('你一路行至贾母房中，见众姊妹都在。黛玉抬眼看你，又垂下眼帘；宝钗端坐饮茶，含笑不语。贾母招手道：「宝玉，来。」');
        story('你心中隐隐觉得，这一生的故事，才刚开了头。你是贾宝玉，生于钟鸣鼎食之家，却不知这满园的富贵与风流，能守住几时。');
        say('—— 案 牍 ——\n你在府中可读书、练武、会友、谈情；亦可出街经商、应试、投军；若逢乱世，或可图谋大事。每做一事，皆耗体力、度光阴，望君好自为之。');
        save();
        render();
      }

      S = load();
      document.getElementById('resetBtn').addEventListener('click', () => {
        if (window.confirm('重开新篇将清空当前进度，确定吗？')) reset();
      });
      render();
      initStory();
    })();
  </script>
</body>
</html>
