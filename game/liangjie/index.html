<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="两界搬运工：1980 冷战年代与现代 2026 双世界穿梭、倒买倒卖、大国博弈与人生模拟。">
  <title>两界搬运工 · 1980</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="seal">两界</span>
        <span class="brand-text">
          <b>两界搬运工</b>
          <small>1980 ⇄ 2026</small>
        </span>
      </div>
      <div class="hud" id="hud"></div>
      <div class="top-actions">
        <button class="btn ghost" id="btnSettings" title="设置">⚙ 设置</button>
        <button class="btn ghost" id="btnHelp" title="帮助">? 帮助</button>
      </div>
    </div>
  </header>

  <main class="layout" id="layout">
    <section class="main-col">
      <div class="panel scene" id="scenePanel">
        <div class="scene-head" id="sceneHead"></div>
        <div class="scene-body" id="sceneBody"></div>
      </div>
      <div class="panel log-panel" id="logPanel">
        <div class="panel-title">流水</div>
        <div class="log-list" id="logList"></div>
      </div>
    </section>

    <aside class="side-col">
      <nav class="tabs" id="sideTabs">
        <button class="tab active" data-tab="travel">穿越</button>
        <button class="tab" data-tab="backpack">背包</button>
        <button class="tab" data-tab="wallet">资金</button>
        <button class="tab" data-tab="bus">公交</button>
        <button class="tab" data-tab="npc">人脉</button>
      </nav>
      <div class="panel side-panel" id="sidePanel"></div>
    </aside>
  </main>

  <div class="modal-root" id="modalRoot" hidden></div>

  <noscript>本游戏需要启用 JavaScript 才能运行。</noscript>

  <script src="js/core/util.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/eventbus.js"></script>
  <script src="js/core/data.js"></script>

  <script src="js/data/tags.js"></script>
  <script src="js/data/timeline.js"></script>
  <script src="js/data/currencies.js"></script>
  <script src="js/data/items_core.js"></script>
  <script src="js/data/items_consumable.js"></script>
  <script src="js/data/items_appliance.js"></script>
  <script src="js/data/items_luxury.js"></script>
  <script src="js/data/items_province.js"></script>
  <script src="js/data/items_commodity.js"></script>
  <script src="js/data/items_daily.js"></script>
  <script src="js/data/vehicles.js"></script>
  <script src="js/data/cities.js"></script>
  <script src="js/data/locations.js"></script>
  <script src="js/data/locations_bj.js"></script>
  <script src="js/data/npcs.js"></script>
  <script src="js/data/npcs_bj.js"></script>
  <script src="js/data/finance.js"></script>
  <script src="js/data/culture.js"></script>

  <script src="js/core/engine.js"></script>
  <script src="js/modules/clock.js"></script>
  <script src="js/modules/economy.js"></script>
  <script src="js/modules/inventory.js"></script>
  <script src="js/modules/travel.js"></script>
  <script src="js/modules/shopping.js"></script>
  <script src="js/modules/finance.js"></script>
  <script src="js/modules/interaction.js"></script>
  <script src="js/modules/gift.js"></script>
  <script src="js/modules/passers.js"></script>
  <script src="js/modules/ai.js"></script>
  <script src="js/modules/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
