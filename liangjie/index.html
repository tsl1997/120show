<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211b">
  <title>两界搬运工</title>
  <style>
    :root{--ink:#e8e3d2;--muted:#aaa58f;--line:#555342;--panel:#20241f;--deep:#111713;--accent:#e6b94d;--danger:#df725f;--ok:#71b98b;--paper:#292d25;--shadow:#070b08}
    *{box-sizing:border-box}
    html{background:var(--deep);color:var(--ink);font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;font-size:15px}
    body{margin:0;min-height:100vh;background-color:var(--deep);background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px)}
    body.old{--ink:#2d261b;--muted:#655b48;--line:#88785c;--panel:#c5b58f;--deep:#8f805e;--accent:#8d1e16;--danger:#8d1e16;--ok:#315a3d;--paper:#d2c39e;--shadow:#53472f;background-image:linear-gradient(rgba(235,222,180,.12),rgba(55,45,26,.08)),repeating-linear-gradient(90deg,transparent 0 7px,rgba(50,35,15,.025) 7px 8px)}
    button,input,select{font:inherit}
    button,select,input[type="number"]{border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);min-height:34px}
    button{cursor:pointer;padding:6px 10px;font-weight:700}
    button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    button:disabled{cursor:not-allowed;opacity:.45}
    button.primary{background:var(--accent);border-color:var(--accent);color:var(--deep)}
    button.danger{border-color:var(--danger);color:var(--danger)}
    button.icon{width:34px;padding:0;font-size:18px}
    input[type="number"]{width:64px;padding:5px}
    select{padding:5px 28px 5px 8px;max-width:100%}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .mast{display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(240px,1fr);align-items:center;gap:18px;padding:13px 18px;border-bottom:2px solid var(--accent);background:var(--panel);box-shadow:0 4px 12px var(--shadow)}
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .seal{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border:2px solid var(--accent);color:var(--accent);font-family:serif;font-size:20px;font-weight:900;transform:rotate(-2deg)}
    h1{margin:0;font-family:serif;font-size:24px;letter-spacing:0}
    .subtitle,.tiny{color:var(--muted);font-size:12px}
    .world-switch{display:flex;border:1px solid var(--line);background:var(--deep);padding:3px}
    .world-tab{border:0;background:transparent;min-width:112px}
    .world-tab.active{background:var(--accent);color:var(--deep)}
    .savebox{min-width:280px;text-align:right;color:var(--muted);font-size:12px}
    .savebox strong,.savebox span{display:block}
    .savebox strong{color:var(--accent);font:800 15px/1.35 Consolas,monospace;overflow-wrap:anywhere}
    #saveIndicator{color:var(--ok)}
    .dash{display:grid;grid-template-columns:215px minmax(390px,1fr) 330px;min-height:calc(100vh - 75px)}
    .rail,.cargo{background:rgba(0,0,0,.1)}
    .rail{border-right:1px solid var(--line);padding:14px 12px}
    .cargo{border-left:1px solid var(--line);padding:14px 12px;min-width:0}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:3px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line);font-family:serif;font-size:16px;font-weight:800}
    .map-list{display:grid;gap:4px}
    .map-btn{position:relative;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:8px 8px 8px 12px;font-weight:500}
    .map-btn.active{border-left-color:var(--accent);background:var(--paper);color:var(--accent)}
    .map-btn.locked{color:var(--muted)}
    .map-btn small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:400}
    .route{margin-top:14px;padding:10px;border:1px dashed var(--line);color:var(--muted);font-size:12px;line-height:1.6}
    .route strong{color:var(--ink)}
    .workbench{min-width:0;padding:14px 16px 120px}
    .status-line{display:grid;grid-template-columns:minmax(120px,1fr) minmax(210px,1.7fr) repeat(5,minmax(88px,1fr));gap:1px;margin-bottom:12px;border:1px solid var(--line);background:var(--line)}
    .meter{background:var(--panel);padding:9px 10px;min-width:0}
    .meter b{display:block;overflow:visible;white-space:normal;overflow-wrap:anywhere;font-size:clamp(12px,1.15vw,15px);line-height:1.25}
    .meter span{color:var(--muted);font-size:11px}
    .bar{height:3px;margin-top:5px;background:var(--deep)}
    .bar i{display:block;height:100%;background:var(--ok)}
    .bar.low i{background:var(--danger)}
    .location-head{display:flex;justify-content:space-between;gap:14px;align-items:start;margin:4px 0 13px}
    .location-head h2{margin:0;font-family:serif;font-size:22px;letter-spacing:0}
    .location-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
    .terminal{border-top:2px solid var(--line);border-bottom:1px solid var(--line)}
    .terminal-head,.goods-row{display:grid;grid-template-columns:minmax(130px,1.4fr) 86px 72px minmax(150px,1fr);align-items:center;gap:8px;padding:8px 9px}
    .terminal-head{color:var(--muted);font-size:11px;text-transform:uppercase}
    .goods-row{min-height:57px;border-top:1px dotted var(--line)}
    .goods-row:hover{background:rgba(255,255,255,.035)}
    .goods-name{min-width:0;font-weight:700}
    .goods-name small{display:block;color:var(--muted);font-size:11px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .price{font-family:Consolas,monospace;color:var(--accent);font-weight:800}
    .trade-ops{display:flex;justify-content:flex-end;align-items:center;gap:5px}
    .empty{padding:35px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
    .panel-note{margin:0 0 10px;padding:9px 10px;border-left:3px solid var(--accent);background:rgba(0,0,0,.1);color:var(--muted);font-size:12px;line-height:1.6}
    .inventory-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:9px}
    .inventory-tabs button{padding:5px 2px;font-size:12px}
    .inventory-tabs button.active{border-color:var(--accent);color:var(--accent)}
    .inv-list{max-height:325px;overflow:auto;border-top:1px solid var(--line)}
    .inv-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;padding:7px 2px;border-bottom:1px dotted var(--line)}
    .inv-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
    .inv-row small{color:var(--muted);font-size:11px}
    .inv-ops{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px;max-width:190px}
    .inv-ops button{min-height:27px;padding:2px 6px;font-size:11px}
    .inv-ops input{width:52px;min-height:27px;padding:2px 4px;font-size:11px}
    .wealth{min-width:210px}.wealth .tiny{white-space:normal;overflow-wrap:anywhere}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.card{padding:11px;border:1px solid var(--line);background:rgba(0,0,0,.08)}.card h3{margin:0 0 5px;font-size:15px}.card p{min-height:34px;margin:4px 0;color:var(--muted);font-size:12px;line-height:1.5}.card .trade-ops{margin-top:8px;justify-content:flex-start;flex-wrap:wrap}
    .cross-box{margin-top:14px;padding:11px;border:1px solid var(--accent);background:rgba(0,0,0,.12)}
    .cross-box p{margin:5px 0 9px;color:var(--muted);font-size:11px;line-height:1.5}
    .cross-box button{width:100%}
    .logbook{margin-top:15px}
    .logs{height:180px;overflow:auto;padding-left:19px;margin:0;color:var(--muted);font:12px/1.55 Consolas,"Microsoft YaHei",sans-serif}
    .logs li{padding:3px 0;border-bottom:1px dotted var(--line)}
    .logs time{color:var(--accent)}
    .npc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:10px}
    .npc{padding:8px;border:1px solid var(--line);background:transparent;text-align:left;font-weight:500}
    .npc.active{border-color:var(--accent);background:var(--paper)}
    .npc b,.npc small{display:block}
    .npc small{color:var(--muted);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .relation{height:4px;background:var(--deep);margin-top:5px}.relation i{display:block;height:100%;background:var(--ok)}
    .mode-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
    .ticket-strip{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.ticket-strip span{border:1px solid var(--line);padding:3px 6px;font-size:11px}
    dialog{width:min(520px,calc(100% - 24px));border:2px solid var(--accent);border-radius:2px;background:var(--panel);color:var(--ink);box-shadow:0 12px 40px #000;padding:0}
    dialog::backdrop{background:rgba(0,0,0,.72)}
    .dialog-body{padding:19px}.dialog-body h3{margin-top:0;font-family:serif;font-size:20px}.dialog-body p{color:var(--muted);line-height:1.65}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}
    #toast{position:fixed;left:50%;bottom:24px;z-index:20;transform:translate(-50%,20px);max-width:min(520px,90vw);padding:10px 15px;border:1px solid var(--accent);background:var(--panel);color:var(--ink);box-shadow:0 6px 20px #000;opacity:0;pointer-events:none;transition:.2s}
    #toast.show{opacity:1;transform:translate(-50%,0)}
    .footer-tools{display:flex;gap:6px;margin-top:13px}
    @media(max-width:1050px){.dash{grid-template-columns:190px 1fr}.cargo{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:16px}.cross-box,.logbook{margin-top:0}.inv-list{max-height:230px}.workbench{padding-bottom:18px}.mast{grid-template-columns:1fr auto}.savebox{display:none}}
    @media(max-width:700px){.mast{grid-template-columns:1fr;padding:10px 12px;gap:9px}.world-switch{width:100%}.world-tab{flex:1}.dash{display:block}.rail{border-right:0;border-bottom:1px solid var(--line);padding:9px 10px}.map-list{display:flex;overflow-x:auto;padding-bottom:5px}.map-btn{flex:0 0 175px;border-left:0;border-bottom:3px solid transparent}.map-btn.active{border-bottom-color:var(--accent)}.route{display:none}.workbench{padding:11px 10px}.status-line{grid-template-columns:repeat(2,minmax(0,1fr))}.meter:first-child{grid-column:1/-1}.location-head{display:block}.actions{justify-content:flex-start;margin-top:9px}.terminal-head{display:none}.goods-row{grid-template-columns:minmax(110px,1fr) 72px;gap:6px}.goods-row>.tiny{display:none}.trade-ops{grid-column:1/-1;justify-content:flex-start}.cargo{display:block;padding:11px 10px}.cross-box,.logbook{margin-top:14px}.npc-grid{grid-template-columns:1fr 1fr}.brand .subtitle{display:none}.inv-row{align-items:start}.inv-ops{max-width:160px}}
  </style>
</head>
<body>
  <header class="mast">
    <div class="brand"><div class="seal" aria-hidden="true">界</div><div><h1>两界搬运工</h1><div class="subtitle">一扇门，两本账，四十六年的价差</div></div></div>
    <nav class="world-switch" aria-label="世界状态">
      <button type="button" class="world-tab active" id="modernTab" disabled>现代 · 2026</button>
      <button type="button" class="world-tab" id="oldTab" disabled>旧时 · 1980</button>
    </nav>
    <div class="savebox"><strong id="topWealth">现代净资产 ¥3,000.00</strong><span id="saveIndicator">● 本地存档就绪</span><span>所有数据仅保存在此浏览器</span></div>
  </header>
  <main class="dash">
    <aside class="rail" aria-label="地点地图">
      <div class="section-title"><span id="mapTitle">现代城区线路</span><small id="mapCount"></small></div>
      <div class="map-list" id="mapList"></div>
      <div class="route"><strong>当前落脚点</strong><br><span id="homeText"></span><br><span id="homeStats"></span></div>
    </aside>
    <section class="workbench" aria-label="经营终端">
      <div class="status-line" id="statusLine"></div>
      <div class="location-head">
        <div><h2 id="locationName">当前位置</h2><p id="locationDesc"></p></div>
        <div class="actions" id="quickActions"></div>
      </div>
      <div id="content"></div>
    </section>
    <aside class="cargo" aria-label="行李与记录">
      <section aria-label="物品管理">
        <div class="section-title"><span>物品流转</span><small id="bagSummary"></small></div>
        <div class="inventory-tabs">
          <button type="button" data-inv="bag" class="active">背包</button>
          <button type="button" data-inv="room">房间仓库</button>
          <button type="button" data-inv="travel">穿越清单</button>
        </div>
        <div class="inv-list" id="inventory"></div>
      </section>
      <section class="cross-box" aria-label="穿越控制">
        <strong id="crossTitle">衣柜后的门</strong>
        <p id="crossHint"></p>
        <button type="button" class="primary" id="crossBtn">穿越至 1980 年</button>
      </section>
      <section class="logbook" aria-label="行动日志">
        <div class="section-title"><span>双界日志</span><small>最近 30 条</small></div>
        <ol class="logs" id="logs"></ol>
        <div class="footer-tools"><button type="button" id="manualSave">立即存档</button><button type="button" class="danger" id="resetGame">重置存档</button></div>
      </section>
    </aside>
  </main>
  <dialog id="modal" aria-labelledby="modalTitle"><div class="dialog-body"><h3 id="modalTitle">确认操作</h3><div id="modalContent"></div><div class="dialog-actions" id="modalActions"></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

    function museumRow(id,into){const n=into?qty(state.bag,id)-qty(state.unidentified.bag,id)-qty(state.fake.bag,id):qty(state.museum.exhibits,id);return `<div class="goods-row"><div class="goods-name">${items[id].name}<small>已鉴定真品 · ${formatMoney(items[id].modern,'modern')}</small></div><div class="price">× ${n}</div><div class="tiny">${items[id].period}</div><div class="trade-ops"><input type="number" min="1" max="${n}" value="1" data-museum-qty="${id}"><button type="button" data-museum-${into?'in':'out'}="${id}">${into?'入馆':'撤展'}</button></div></div>`;}
    function renderCharity(){return `<div class="panel-note">捐款、缴税与公共建设提升人气。公共事业产生少量月度公益收入，固定收5%公益税。缴税优先补足欠税，剩余金额结转为预缴税。</div><div class="mode-line"><input type="number" min="1" value="10000" data-charity-amount><button type="button" data-charity="donate">公益捐款</button><button type="button" data-charity="tax">缴纳税款</button><span class="tiny">欠税 ${formatMoney(state.finance.taxDebt||0,'modern')} · 已预缴 ${formatMoney(state.finance.prepaidTax||0,'modern')}</span></div><div class="cards">${Object.entries(publicDefs).map(([id,x])=>`<div class="card"><h3>${x.name}</h3><p>建设费 ${formatMoney(x.price,'modern')} · 人气 +${x.pop} · 月公益收入 ${formatMoney(x.income,'modern')} · 已建${state.publicWorks[id]||0}</p><button type="button" data-charity="${id}">建设</button></div>`).join('')}</div>`;}
    function renderMatchmaking(){refreshMatches();if(state.matchmaking.partner){const p=state.matchmaking.partner;return `<div class="panel-note">伴侣：${p.name}，${p.age}岁，${p.job}。你们于 ${p.since} 确认稳定关系；该关系奖励不会重复领取。</div>`;}return `<div class="panel-note">每月刷新成年候选人。匹配分综合净资产、住房、启用载具、博物馆收藏、人气及相处投入；交流与约会耗时。</div><div class="cards">${state.matchmaking.candidates.map(c=>`<div class="card"><h3>${c.name} · ${c.age}岁</h3><p>${c.job} · 个人财富${compactMoney(c.wealth)} · 容貌${c.looks}/100 · 偏好${CATS[c.like]}<br>最低：净资产${compactMoney(c.needs.wealth)} / 住房${homes[c.needs.home].name} / 载具声望${c.needs.vehicle} / 收藏${compactMoney(c.needs.collection)} / 人气${c.needs.popularity}<br>当前匹配分 ${matchScore(c)} · 默契${c.rapport}</p><div class="trade-ops"><button type="button" data-match="talk|${c.id}">交流</button><button type="button" data-match="gift|${c.id}">赠礼</button><button type="button" data-match="date|${c.id}">约会</button><button type="button" data-match="confess|${c.id}">表白</button></div></div>`).join('')}</div>`;}
    function renderFineRestaurant(stock){const ids=['wildgreens','ginseng','cordyceps','rareseafood'].filter(id=>qty(state.bag,id));return `${table(stock.map(id=>itemRow(id)).join(''))}<div class="section-title"><span>天然食材收购</span><small>月预算 ${formatMoney(state.restaurantBudget.left,'modern')}</small></div>${ids.map(id=>`<div class="goods-row"><div class="goods-name">${items[id].name}<small>背包 ${qty(state.bag,id)} · 普通应税收入</small></div><div class="price">${formatMoney(items[id].modern*1.35,'modern')}</div><div class="tiny">每次1件</div><div class="trade-ops"><button type="button" data-restaurant-sell="${id}">出售</button></div></div>`).join('')||'<div class="empty">背包中没有餐馆收购的天然食材</div>'}`;}
    function renderAntiqueBuyback(){return `<div class="section-title"><span>折价回收</span><small>月度资金 ${formatMoney(state.antiqueBuyback.left,'old')}</small></div><div class="panel-note">只收背包古董，逐件处理。优先未鉴定品（旧基准15%-30%），否则真品（65%-85%），赝品按废品价。</div>${Object.keys(state.bag).filter(id=>items[id].antique).map(id=>`<div class="goods-row"><div class="goods-name">${items[id].name}<small>背包 ${qty(state.bag,id)}</small></div><div class="price">旧值 ${formatMoney(items[id].old,'old')}</div><div class="tiny">逐件</div><div class="trade-ops"><button type="button" data-antique-buyback="${id}">卖出一件</button></div></div>`).join('')}`;}
    function renderVillage(place){const month=monthKey(state.time.old);if(state.villageRestoreMonth!==month){state.villageRestoreMonth=month;state.villageStocks={};}const stock=state.villageStocks[place]||(state.villageStocks[place]={mystery_jar:2,mystery_bowl:2,mystery_scroll:1,mystery_bronze:1,wildgreens:5,ginseng:place==='villageHebei'?2:0,cordyceps:place==='forestNortheast'?2:0}),needs={villageBeijing:['food','daily'],villageHebei:['food','daily','fashion'],forestNortheast:['food','fashion','wholesale']},names=['赵大山','李秋菊','王守林','陈桂芳','孙福生'];return `<div class="panel-note">本次遇到村民：${names.sort(()=>Math.random()-.5).slice(0,3).join('、')}。本地主要需求${needs[place].map(c=>CATS[c]).join('、')}，每次用背包中一件匹配物资换一件；村级库存按旧时月份少量恢复。模糊古董在鉴定后替换为具体真实古董。</div><div class="cards">${Object.keys(stock).filter(id=>qty(stock,id)).map(id=>`<div class="card"><h3>${items[id].name}</h3><p>${items[id].desc} · 库存${qty(stock,id)}</p><button type="button" data-village-trade="${place}|${id}">交换</button></div>`).join('')}</div>`;}
    function renderAirport(){const destinations=['hongkong','tokyo','sanfrancisco','europe','africa'];return `<div class="panel-note">国际机场解锁条件：启用载具社会声望达到35，或外贸关系50，或公安/街道关系60。出发支付oldCNY，返程支付当地币；航程12小时，行李最多12件。</div><div class="cards">${destinations.map(r=>`<div class="card"><h3>${regionNames[r]}</h3><p>机票 850 oldCNY · 当地货币 ${regionCurrency[r]}</p><button type="button" data-fly="${r}">购买机票</button></div>`).join('')}</div>`;}
    function renderFactions(){return `<div class="panel-note">赠送外汇实际扣款。公安/街道最高降低普通税5个百分点；外贸提高官方背书，文化提高鉴定与博物馆影响，科学院提高技术收购。</div><div class="cards">${Object.entries({trade:'外贸部门',security:'公安/街道',culture:'文化机构',science:'科学院'}).map(([id,name])=>`<div class="card"><h3>${name} · ${state.factions[id]}</h3><p>${id==='security'?'普通税率最多降低5个百分点':id==='culture'?'提高鉴定与博物馆效果':id==='science'?'提高技术收购成功率':'提高销售背书与机场许可'}</p><div class="trade-ops"><select data-faction-currency="${id}">${['HKD','JPY','USD','EUR','GBP','KES'].map(c=>`<option value="${c}">${c} ${state.wallets[c].toFixed(0)}</option>`).join('')}</select><input type="number" value="100" min="1" data-faction-amount="${id}"><button type="button" data-faction="${id}">赠送</button></div></div>`).join('')}</div>`;}
    function renderOffice(){const price=48000+state.otherCourtyards*18000;return `<div class="panel-note">你已取得56号院全部八户产权，街道办允许购买附近其他四合院。每院增加70仓库空间和2件穿越上限。</div><div class="goods-row"><div class="goods-name">附近完整四合院<small>当前已购 ${state.otherCourtyards} 院</small></div><div class="price">${formatMoney(price,'old')}</div><div class="tiny">+70空间<br>+2件</div><div class="trade-ops"><button type="button" data-courtyard>购买</button></div></div>`;}
     function renderScience(){const ids=Object.keys(state.bag).filter(id=>items[id].cat==='seed');return `<div class="panel-note">陈研究员好感和街道关系会影响采购。试验采购成功时按旧时基准价值约3.4倍支付，并提高陈研究员好感。</div>${table(ids.map(id=>itemRow(id,'science')).join(''))}`;}
    function renderInventory(){
       const store=invTab==='bag'?state.bag:invTab==='room'?state.rooms[state.world]:state.travel;const cap=invTab==='bag'?'20件':invTab==='room'?roomCap()+'空间':travelCap()+'件';$('#bagSummary').textContent=`${count(store)}/${cap}`;
      document.querySelectorAll('[data-inv]').forEach(b=>b.classList.toggle('active',b.dataset.inv===invTab));
       $('#inventory').innerHTML=Object.entries(store).length?Object.entries(store).filter(([id])=>items[id]).map(([id,n])=>{const item=items[id],input=`<input type="number" min="1" max="${n}" value="1" aria-label="${item.name}批量数量" data-inv-qty="${invTab}|${id}">`;let buttons=input;if(invTab==='bag')buttons+=`<button type="button" data-batch-move="${id}|bag|room">入库</button><button type="button" data-batch-move="${id}|bag|travel">行囊</button>`;if(invTab==='room')buttons+=`<button type="button" data-batch-move="${id}|room|bag">取出</button><button type="button" data-batch-move="${id}|room|travel">行囊</button>`;if(invTab==='travel')buttons+=`<button type="button" data-batch-move="${id}|travel|bag">撤回</button><button type="button" data-batch-move="${id}|travel|room">入库</button>`;if(item.action==='use')buttons+=`<button type="button" data-batch-use="${invTab}|${id}">食用</button>`;buttons+=`<button type="button" class="danger" data-drop="${invTab}|${id}">丢弃</button>`;const unknown=item.antique?Math.min(n,qty(unknownStore(invTab),id)):0,fake=item.antique?Math.min(n-unknown,qty(fakeStore(invTab),id)):0;return `<div class="inv-row"><div><strong>${item.name} × ${n}</strong><small>${CATS[item.cat]} · 单件${item.size}空间${item.antique?` · 真品${n-unknown-fake} / 赝品${fake} / 未鉴定${unknown}`:''}</small></div><div class="inv-ops">${buttons}</div></div>`;}).join(''):'<div class="empty">这里还没有物品</div>';
    }
    function renderCross(){$('#crossTitle').textContent=state.world==='modern'?'衣柜后的门':'厢房里的旧木门';$('#crossHint').textContent=`清单 ${count(state.travel)}/${travelCap()} 件。穿越时背包余物自动留在当前房间，清单物品成为下一界背包；耗时70分钟。`;$('#crossBtn').textContent=state.world==='modern'?'穿越至 1980 年':'穿越回 2026 年';}
    function renderLogs(){$('#logs').innerHTML=state.logs.map(l=>`<li><time>${l.t}</time> ${l.text}</li>`).join('');}
    function render(){
      document.body.classList.toggle('old',state.world==='old');$('#modernTab').classList.toggle('active',state.world==='modern');$('#oldTab').classList.toggle('active',state.world==='old');renderStatus();renderMap();renderContent();renderInventory();renderCross();renderLogs();save();
    }
    document.addEventListener('click',(e)=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.place)changePlace(b.dataset.place);
      if(b.dataset.buy){const input=document.querySelector(`[data-qty="${b.dataset.buy}"]`);buy(b.dataset.buy,input.value);}
      if(b.dataset.inv){invTab=b.dataset.inv;renderInventory();}
       if(b.dataset.move){const [id,from,to]=b.dataset.move.split('|');moveItem(id,from,to);}
       if(b.dataset.batchMove){const [id,from,to]=b.dataset.batchMove.split('|'),input=document.querySelector(`[data-inv-qty="${from}|${id}"]`);moveItems(id,from,to,input?.value);}
       if(b.dataset.batchUse){const [container,id]=b.dataset.batchUse.split('|'),input=document.querySelector(`[data-inv-qty="${container}|${id}"]`);useItems(container,id,input?.value);}
       if(b.dataset.drop){const [container,id]=b.dataset.drop.split('|'),input=document.querySelector(`[data-inv-qty="${container}|${id}"]`);dropItems(container,id,input?.value);}
      if(b.dataset.use)eat(b.dataset.use);
       if(b.dataset.quick==='meal')quickMeal();if(b.dataset.quick==='sleep')sleep();if(b.dataset.quick==='refresh')refreshStock();if(b.dataset.quick==='streetRefresh')refreshStreet(true);if(b.dataset.quick==='park')parkWalk();
      if(b.dataset.npc){selectedNpc=b.dataset.npc;renderContent();}
       if(b.dataset.npcsell)sellToNpc(b.dataset.npcsell);if(b.dataset.streetsell)streetSell(b.dataset.streetsell);if(b.dataset.streetSelect){selectedStreetNpc=b.dataset.streetSelect;renderContent();}if(b.dataset.streetNpc)talkStreet(b.dataset.streetNpc);if(b.dataset.streetSell)streetNpcSell(selectedStreetNpc,b.dataset.streetSell);if(b.dataset.searchHome)searchHome(b.dataset.searchHome);if(b.dataset.techsell)sellTech(b.dataset.techsell);
       if(b.hasAttribute('data-house'))buyNpcHouse();if(b.dataset.appraise)appraiseOld(b.dataset.appraise);if(b.dataset.modernAppraise)appraiseModern(b.dataset.modernAppraise,b.dataset.level);if(b.dataset.scrap)scrapFake(b.dataset.scrap);if(b.dataset.auction)auction(b.dataset.auction);if(b.hasAttribute('data-overseas'))overseasExchange();
      if(b.dataset.set)makeSet(b.dataset.set,b.dataset.set==='monkey'?'monkeyset':'redset');if(b.dataset.seedsell)sellSeeds(b.dataset.seedsell);
       if(b.dataset.home)upgradeHome(Number(b.dataset.home));if(b.hasAttribute('data-courtyard'))buyCourtyard();
       if(b.dataset.vehicleBuy)buyVehicle(b.dataset.vehicleBuy);if(b.dataset.vehicleSelect)selectVehicle(b.dataset.vehicleSelect);if(b.dataset.vehicleScrap)scrapVehicle(b.dataset.vehicleScrap);
       if(b.dataset.bank){const [kind,c]=b.dataset.bank.split('|'),input=document.querySelector(`[data-bank-amount="${c}"]`);bankAction(kind,c,input?.value);}
       if(b.hasAttribute('data-fx'))exchangeCurrency($('[data-fx-from]').value,$('[data-fx-to]').value,$('[data-fx-amount]').value);
       if(b.hasAttribute('data-museum-build'))buildMuseum();if(b.dataset.museumIn){const input=document.querySelector(`[data-museum-qty="${b.dataset.museumIn}"]`);museumMove(b.dataset.museumIn,input?.value,true);}if(b.dataset.museumOut){const input=document.querySelector(`[data-museum-qty="${b.dataset.museumOut}"]`);museumMove(b.dataset.museumOut,input?.value,false);}
       if(b.dataset.charity)charityAction(b.dataset.charity);if(b.dataset.match){const [action,id]=b.dataset.match.split('|');matchAction(id,action);}if(b.dataset.villageTrade){const [place,id]=b.dataset.villageTrade.split('|');villageTrade(place,id);}if(b.dataset.restaurantSell)restaurantSell(b.dataset.restaurantSell);if(b.dataset.antiqueBuyback)antiqueBuyback(b.dataset.antiqueBuyback);
       if(b.dataset.faction){const id=b.dataset.faction,c=document.querySelector(`[data-faction-currency="${id}"]`).value,a=document.querySelector(`[data-faction-amount="${id}"]`).value;factionDonate(id,c,a);}
       if(b.dataset.fly)fly(b.dataset.fly);if(b.dataset.regionPlace)changeRegionalPlace(b.dataset.regionPlace);if(b.dataset.regionalBuy){const input=document.querySelector(`[data-regional-qty="${b.dataset.regionalBuy}"]`);regionalBuy(b.dataset.regionalBuy,input?.value);}if(b.dataset.regionalSell)regionalSell(b.dataset.regionalSell);if(b.dataset.land!==undefined)buyLand(Number(b.dataset.land));
    });
    document.addEventListener('change',(e)=>{if(e.target.id==='tradeMode'){tradeMode=e.target.value;renderContent();}});
    $('#crossBtn').addEventListener('click',crossWorld);$('#manualSave').addEventListener('click',()=>save(true));
     $('#resetGame').addEventListener('click',()=>confirmModal('重置全部进度','这会删除本浏览器中的《两界搬运工》存档，并立即开始新游戏。此操作无法撤销。',()=>{localStorage.removeItem(SAVE_KEY);state=freshState();log('新游戏开始：现代资金3000元，旧时资金0元。');invTab='bag';selectedNpc='liu';render();toast('存档已重置');}));
    load();render();
  })();
  </script>
</body>
</html>
